<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#151b2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Little Sparks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a table of chunky wooden blocks on a pale board. One screen, no scrolling during play. */
:root{
  color-scheme: dark;
  --board:#151b2b; --paper:#252e45; --ink:#f2e9d6; --muted:#a7aec2; --edge:#0b0f1a; --line:#3a4562;
  --good-bg:#1d4a33; --sel-bg:#1e3a5f; --lit-bg:#5a4716; --cell:#323c57; --grey:#5d6782; --grey-d:#454e66;
  --act:#f2e9d6; --act-ink:#151b2b; --grass:#22402c;
  --red:#e0584b;   --red-d:#a93a2f;
  --yellow:#e8b13f;--yellow-d:#a8781a;
  --green:#3ea567; --green-d:#277447;
  --blue:#3f86d4;  --blue-d:#295f9c;
  --purple:#8461c9;--purple-d:#5c4196;
  --pink:#dc6896;  --pink-d:#a7466d;
  --orange:#e2843e;--orange-d:#a95e22;
  --teal:#24a09b;  --teal-d:#167370;
  --indigo:#5d6fd9;--indigo-d:#3f4fa6;
  --lime:#7aa83a;  --lime-d:#557724;
  --display:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Andika","Comic Sans MS","Trebuchet MS",sans-serif; /* infant letterforms: single-storey a and g */
}
/* layout idea unchanged: chunky blocks on a board. Dark is the default; light is a grown-ups option */
:root[data-mode="light"]{
  color-scheme: light;
  --board:#e4f1ee; --paper:#ffffff; --ink:#1f2a44; --muted:#5d6b85; --edge:#c3d3d6; --line:#c3d3d6;
  --good-bg:var(--good-bg); --sel-bg:var(--sel-bg); --lit-bg:var(--lit-bg); --cell:var(--cell); --grey:#9aa7b8; --grey-d:#7c8a9c;
  --act:#1f2a44; --act-ink:#ffffff; --grass:#a8d8a0;
  --red:#ef5b4c;   --red-d:#b93c30;
  --yellow:#f6b93b;--yellow-d:#c28a14;
  --green:#3fae6a; --green-d:#2a7f4a;
  --blue:#3d8fe0;  --blue-d:#2867ab;
  --purple:#8a63d2;--purple-d:#6243a3;
  --pink:#ee6fa0;  --pink-d:#bd4675;
  --orange:#f08a3c;--orange-d:#b9621f;
  --teal:#22a6a1;  --teal-d:#14787a;
  --indigo:#5b6ee1;--indigo-d:#3f4fb0;
  --lime:#86b83f;  --lime-d:#5d8327;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--board);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;overflow:hidden;
}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* the block: the one bold element everything is built from */
.block{
  border:0;border-radius:22px;background:var(--paper);cursor:pointer;
  box-shadow:0 8px 0 var(--edge),0 12px 20px rgba(31,42,68,.10);
  transition:transform .08s,box-shadow .08s,opacity .2s;
}
.block:active{transform:translateY(6px);box-shadow:0 2px 0 var(--edge)}
.block:disabled{cursor:default}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;gap:18px;padding:20px 20px 16px;min-height:0}
.home h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,6.5vmin,56px);margin:0;letter-spacing:.01em}
.home h1 span{color:var(--red)}
.tiles{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;min-height:0;padding-bottom:10px}
@media (orientation:landscape){.tiles{grid-template-columns:repeat(5,1fr)}}

.tile .ico.dogico{width:1.9em;height:1.9em;display:block}
.tile .ico.dogico svg{width:100%;height:100%}

/* ---------- my dog ---------- */
.scene{position:relative;width:min(90vmin,620px);height:min(58vmin,400px);flex:none;border-radius:28px;background:#fdf0cf;overflow:hidden;box-shadow:0 8px 0 var(--edge)}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:26%;background:#e2b98a}
.scene .win{position:absolute;left:6%;top:10%;width:19%;height:32%;background:#cfeaf7;border:6px solid #fff;border-radius:12px;box-shadow:0 3px 0 var(--edge)}
.scene .win:after{content:"";position:absolute;right:14%;top:14%;width:34%;height:34%;border-radius:50%;background:#f6b93b}
.scene.night .win{background:#27325a}
.scene.night .win:after{background:#fdf0cf}
.scene.out{background:#cfeaf7}
.scene.out .win{left:auto;right:8%;top:8%;width:15%;height:22%;border:0;background:none;box-shadow:none}
.scene.out .win:after{right:0;top:0;width:100%;height:100%}
.scene.out .floor{left:-12%;right:-12%;height:30%;background:#7cc77f;border-radius:50% 50% 0 0/45% 45% 0 0}
.dog{position:absolute;left:0;right:0;bottom:2%;height:94%;display:flex;justify-content:center;pointer-events:none}
.dog svg{height:100%;width:auto;display:block;overflow:visible}
.dog .x{display:none}
.dog .tail{transform-origin:196px 236px;animation:wag .5s ease-in-out infinite alternate}
.dog .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.dog.s-hungry .rumble,.dog.s-hungry .brows,.dog.s-thirsty .tongue,.dog.s-thirsty .drops,.dog.s-thirsty .brows,
.dog.s-dirty .mud,.dog.s-dirty .brows,.dog.s-scruffy .tufts,.dog.s-scruffy .brows,.dog.s-play .woof,.dog.s-play .tongue,
.dog.s-walk .leadm,.dog.s-sleepy .lids,.dog.s-sleepy .zzz,.dog.s-poop .brows,
.dog.happy .hearts,.dog.happy .tongue,.dog.happy .smile,.dog.a-bath .bubbles,.dog.a-brush .sparkle,.dog.a-bath .sparkle,
.dog.asleep .lids,.dog.asleep .zzz,.dog.asleep .bedx{display:inline}
.dog.s-sleepy .eye,.dog.asleep .eye,.dog.happy .eye{display:none}
.dog.s-thirsty .tongue{transform-origin:150px 140px;animation:pant .3s infinite alternate}
.dog.s-hungry .rumble{animation:fade .6s infinite alternate}
.dog.s-play svg,.dog.a-ball svg,.dog.a-lead svg{animation:hop .32s ease-out infinite alternate}
.dog.s-walk .head{transform-origin:150px 160px;animation:tilt 1.2s ease-in-out infinite alternate}
.dog.happy .tail,.dog.s-play .tail{animation-duration:.16s}
.dog.happy .hearts{animation:rise 1.6s ease-out infinite}
.dog.asleep .tail{animation:none}
.dog .zzz{animation:fade 1.2s infinite alternate}
.prop{position:absolute;left:5%;bottom:5%;width:23%}
.prop.r{left:auto;right:6%}
.prop svg{width:100%;display:block;overflow:visible}
.prop.bounce svg{animation:hop .3s ease-out infinite alternate}
.bubble{position:absolute;right:4%;top:6%;width:24%;background:#fff;border-radius:50%;padding:3%;box-shadow:0 4px 0 var(--edge)}
.bubble svg{width:100%;display:block}
.tray{display:grid;gap:14px;justify-content:center}
.tool{width:min(17vmin,130px);height:min(17vmin,130px);padding:8%;display:grid;place-items:center}
.tool svg{width:100%;height:100%;display:block;overflow:visible}
.tool.hint{animation:pulse 1s infinite}
.kib{display:flex;gap:8px;justify-content:center;min-height:30px;flex-wrap:wrap}
.kib i{width:26px;height:26px;border-radius:50%;background:#a9713f;display:block}
.coats{display:flex;gap:16px;justify-content:center}
.coat{width:64px;height:64px;border-radius:50%;border:5px solid var(--paper);box-shadow:0 0 0 3px var(--line);cursor:pointer;padding:0}
.coat.on{box-shadow:0 0 0 5px var(--ink)}
.nameline{min-width:min(60vmin,420px);min-height:min(13vmin,92px);border-bottom:5px solid var(--ink);text-align:center;font-weight:700;font-size:min(10vmin,72px);line-height:1.2}
.scene.small{width:min(46vmin,300px);height:min(40vmin,260px)}

/* ---------- tunes ---------- */
.xylo{display:flex;align-items:flex-end;justify-content:center;gap:1.6vmin;height:min(50vmin,380px);flex:none}
.xbar{width:min(9.6vmin,76px);border:0;border-radius:14px;box-shadow:0 6px 0 rgba(31,42,68,.28);cursor:pointer;padding:0;transition:transform .08s,filter .08s}
.xbar:disabled{opacity:.16;cursor:default}
.xbar.lit{transform:translateY(-12px) scale(1.05);filter:brightness(1.3)}
.xbar.next{outline:6px solid var(--ink);outline-offset:3px;animation:pulse .8s infinite}
.choice.lit{background:var(--lit-bg);transform:scale(1.08)}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pant{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6%)}}
@keyframes tilt{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes fade{from{opacity:.25}to{opacity:1}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:var(--c);box-shadow:0 8px 0 var(--cd),0 12px 20px rgba(31,42,68,.12);
  color:#fff;min-height:0;padding:10px;
}
.tile:active{box-shadow:0 2px 0 var(--cd)}
.tile .ico{font-family:var(--body);font-weight:700;font-size:clamp(28px,8vmin,64px);line-height:1;display:flex;gap:.18em;align-items:center}
.tile .ico svg{width:1em;height:1em}
.tile .nm{font-family:var(--display);font-weight:500;font-size:clamp(16px,3.4vmin,26px);text-align:center;line-height:1.15}
.homefoot{display:flex;justify-content:flex-end}
.lbl{font-family:var(--display);font-weight:500;font-size:clamp(16px,3vmin,22px);color:var(--muted);margin:0 0 -8px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:10px}
.dtile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 6px;color:var(--ink)}
.dtile .ico{display:flex;gap:5px}
.dtile .ico i{width:clamp(16px,4.4vmin,34px);height:clamp(16px,4.4vmin,34px);border-radius:7px;display:block}
.dtile .nm{font-family:var(--display);font-weight:500;font-size:clamp(14px,3.2vmin,24px);text-align:center;line-height:1.15}
.dtile.fin{background:var(--good-bg);box-shadow:0 8px 0 var(--green),0 12px 20px rgba(31,42,68,.10)}
.dtile .tick{position:absolute;top:8px;right:10px;font-family:var(--display);color:var(--green-d);font-size:clamp(14px,3vmin,22px)}

/* hold-to-open for grown-ups */
.hold{
  position:relative;overflow:hidden;border:2px solid var(--line);background:transparent;border-radius:999px;
  padding:8px 16px;font-size:15px;color:var(--muted);cursor:pointer;
}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cell);z-index:0}
.hold.going i{width:100%;transition:width 3s linear}
.hold b{position:relative;font-weight:400;z-index:1}

/* ---------- game shell ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.rbtn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none}
.rbtn svg{width:30px;height:30px}
.dots{flex:1;display:flex;justify-content:center;gap:10px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--cell)}
.dots i.on{background:var(--green)}
.prompt{font-family:var(--display);font-weight:500;text-align:center;font-size:clamp(22px,5vmin,40px);padding:4px 16px 0;margin:0;text-wrap:balance}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:16px;padding:12px 16px 24px;overflow:auto}

.show{display:flex;align-items:center;justify-content:center;gap:4vmin;flex-wrap:wrap}
.show.col{flex-direction:column;gap:2vmin}
.pic{font-size:min(24vmin,170px);line-height:1.1;background:none;border:0;padding:0;cursor:pointer}
.group{display:grid;gap:1vmin 1.6vmin;font-size:min(9vmin,66px);line-height:1.15}
.group.many{font-size:min(6.6vmin,48px);gap:.4vmin 1.4vmin}
.group .gone{opacity:.22;position:relative}
.group .gone:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:5px solid var(--red);transform:rotate(-35deg)}
.plus{font-family:var(--display);font-size:min(12vmin,80px);color:var(--muted)}
.eq{font-weight:700;font-size:min(15vmin,110px);line-height:1.1;letter-spacing:.04em}
.nums{display:flex;gap:1.6vmin;justify-content:center}
.nums div{width:min(15vmin,110px);height:min(15vmin,110px);border-radius:18px;background:var(--paper);box-shadow:0 6px 0 var(--edge);display:grid;place-items:center;font-weight:700;font-size:min(8vmin,58px)}
.nums div.q{background:transparent;box-shadow:none;border:4px dashed var(--muted);color:var(--muted)}

.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.choices.c3{display:grid;grid-template-columns:repeat(3,auto)}
.choice{width:min(21vmin,170px);height:min(21vmin,170px);display:grid;place-items:center;padding:8px}
.choice.wide{width:auto;height:auto;min-width:min(34vmin,240px);padding:14px 22px}
.choice.wide .group{font-size:min(6vmin,44px)}
.choice .num,.choice .ltr{font-weight:700;font-size:min(12vmin,96px);line-height:1}
.choice .wordtxt{font-weight:700;font-size:min(9vmin,64px);line-height:1.2}
.choice .shape{width:78%;height:78%}
.shape{display:block}
.shape svg{width:100%;height:100%;display:block}
.choice.right{background:var(--good-bg);box-shadow:0 8px 0 var(--green),0 12px 20px rgba(31,42,68,.10);animation:pop .45s}
.choice.nope{opacity:.3;animation:shake .35s}
.choice.hint{animation:pulse 1s infinite}

/* pattern row */
.seq{display:flex;gap:1.6vmin;align-items:center;justify-content:center;flex-wrap:nowrap}
.seq .cell{width:min(10vmin,84px);height:min(10vmin,84px);flex:none}
.seq .gap{border:4px dashed var(--muted);border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:min(7vmin,54px);color:var(--muted)}
.seq .gap.filled{border-color:transparent}
.seq .gap .shape{width:100%;height:100%}

/* spelling */
.slots{display:flex;gap:12px}
.slot,.ltile{width:min(17vmin,130px);height:min(17vmin,130px);font-weight:700;font-size:min(11vmin,88px);line-height:1;display:grid;place-items:center;padding:0}
.five .slot,.five .ltile{width:min(14.5vmin,112px);height:min(14.5vmin,112px);font-size:min(9.5vmin,74px)}
.slot{border-radius:18px;border:4px dashed var(--muted)}
.slot.filled{border:4px solid var(--green);background:var(--good-bg)}
.ltile.used{opacity:.15}
.shake{animation:shake .35s}

/* pairs */
.cards{display:grid;gap:12px}
.card{line-height:1;display:grid;place-items:center;padding:0;background:var(--purple);box-shadow:0 6px 0 var(--purple-d);border-radius:16px;font-weight:700}
.card span{visibility:hidden}
.card.up{background:var(--paper);box-shadow:0 6px 0 var(--edge)}
.card.up span{visibility:visible}
.card.gone{background:var(--good-bg);box-shadow:0 6px 0 var(--green)}

/* copy it */
.copy{display:flex;gap:4vmin;align-items:center;justify-content:center;flex-wrap:wrap}
.copy.mirror{flex-wrap:nowrap;gap:2vmin}
.mline{align-self:stretch;border-left:5px dashed var(--muted)}
.gridbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.gridbox .cap{font-family:var(--display);font-size:clamp(16px,3.2vmin,24px);color:var(--muted)}
.grid{display:grid;gap:5px;background:var(--paper);padding:9px;border-radius:20px;box-shadow:0 8px 0 var(--edge)}
.grid button,.grid div{border-radius:9px;border:0;background:var(--cell);padding:0}
.grid button{cursor:pointer}
.grid.done{box-shadow:0 8px 0 var(--green);animation:pop .45s}
.paints{display:flex;gap:16px}
.paint{width:64px;height:64px;border-radius:50%;border:5px solid var(--paper);box-shadow:0 0 0 3px var(--line);cursor:pointer;padding:0}
.paint.on{box-shadow:0 0 0 5px var(--ink)}

/* daily: word of the day */
.wboard{display:grid;gap:8px}
.wrow{display:flex;gap:8px}
.wcell{width:min(9vmin,64px);height:min(9vmin,64px);border-radius:12px;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:min(6vmin,42px);line-height:1}
.wcell.g{background:var(--green);border-color:var(--green-d);color:#fff}
.wcell.y{background:var(--yellow);border-color:var(--yellow-d);color:#1f2a44}
.wcell.n{background:var(--grey);border-color:var(--grey-d);color:#fff}
.keys{display:grid;grid-template-columns:repeat(7,auto);gap:6px;justify-content:center}
.key{width:min(11vmin,80px);height:min(10vmin,70px);border-radius:12px;border:0;background:var(--paper);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:min(6vmin,40px);line-height:1;cursor:pointer;padding:0}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.key.g{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.key.y{background:var(--yellow);color:#1f2a44;box-shadow:0 4px 0 var(--yellow-d)}
.key.n{background:var(--grey);color:#fff;box-shadow:0 4px 0 var(--grey-d)}
.key.act{width:min(24vmin,170px);background:var(--act);color:var(--act-ink);box-shadow:0 4px 0 var(--edge);font-family:var(--display);font-size:min(4.4vmin,28px)}
.acts{display:flex;gap:20px;justify-content:center}
.note{font-size:clamp(16px,3.4vmin,24px);color:var(--muted);min-height:1.4em;text-align:center;margin:0}
.cluepic{font-size:min(14vmin,96px);line-height:1}

/* daily: sort it */
.bands{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px}
.band{border-radius:18px;padding:10px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;animation:pop .45s}
.band b{font-family:var(--display);font-weight:500;font-size:clamp(18px,4vmin,28px)}
.band span{font-size:min(8vmin,50px);line-height:1}
.sgrid{display:grid;grid-template-columns:repeat(3,auto);gap:16px}
.sgrid.c4{grid-template-columns:repeat(4,auto);gap:12px}
.stile{width:min(22vmin,160px);height:min(22vmin,160px);font-size:min(13vmin,96px);line-height:1;display:grid;place-items:center;padding:0}
.c4 .stile{width:min(18vmin,136px);height:min(18vmin,136px);font-size:min(11vmin,80px)}
.stile.sel{background:var(--sel-bg);box-shadow:0 8px 0 var(--blue),0 12px 20px rgba(31,42,68,.10)}

/* daily: word garden */
.found{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px}
.found span{background:var(--good-bg);border:2px solid var(--green);border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(18px,4vmin,28px)}
.found span.todo{background:transparent;border:2px dashed var(--muted);color:transparent;min-width:3.2em}
.entry{min-width:min(60vmin,420px);min-height:min(15vmin,104px);border-bottom:5px solid var(--ink);text-align:center;font-weight:700;font-size:min(12vmin,88px);line-height:1.15;letter-spacing:.06em}
.gl{display:flex;gap:12px;justify-content:center}
.gl .ltile{width:min(15.5vmin,120px);height:min(15.5vmin,120px);font-size:min(10vmin,80px)}
.gl .ltile.mid{color:#1f2a44;background:var(--yellow);box-shadow:0 8px 0 var(--yellow-d),0 12px 20px rgba(31,42,68,.10)}

/* end screens */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
.end .big{font-size:min(34vmin,220px);line-height:1;animation:pop .6s}
.end h2{font-family:var(--display);font-weight:600;font-size:clamp(30px,7vmin,60px);margin:0;text-wrap:balance}
.end p{font-size:clamp(18px,3.6vmin,28px);margin:0;color:var(--muted);max-width:22em}
.endbtns{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.go{padding:18px 34px;font-family:var(--display);font-size:clamp(20px,4vmin,30px);color:#fff;background:var(--blue);box-shadow:0 8px 0 var(--blue-d)}
.go:active{box-shadow:0 2px 0 var(--blue-d)}
.go.alt{background:var(--paper);color:var(--ink);box-shadow:0 8px 0 var(--edge)}

/* grown-ups panel */
.parent{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;max-width:760px;width:100%;margin:0 auto;font-size:17px}
.parent h2{font-family:var(--display);font-weight:600;font-size:30px;margin:0}
.parent h3{font-family:var(--display);font-weight:500;font-size:20px;margin:10px 0 0}
.parent p{margin:0;color:var(--muted);max-width:65ch}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--paper);border-radius:16px;padding:12px 14px}
.plabel{font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:15px}
.segb.on{background:var(--ink);border-color:var(--ink);color:var(--board)}
.parent .go{align-self:flex-start;font-size:20px;padding:14px 28px}

/* ---------- v3 additions ---------- */
/* guess the word: typing goes straight into the grid */
.wwrap{position:relative;flex:none}
.wboard{--c:56px;gap:6px}
.wboard .wrow{gap:6px}
.wboard .wcell{width:var(--c);height:var(--c);font-size:calc(var(--c)*.6);border-radius:calc(var(--c)*.18)}
.wcell.now{border-color:var(--line)}
.wcell.typed{border-color:var(--blue)}
.wform{position:absolute;inset:0;margin:0}
.ghost{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;cursor:pointer;-webkit-user-select:text;user-select:text}
.stage.tight{gap:10px;padding-top:6px}
@media (max-height:760px){.rbtn{width:48px;height:48px}.rbtn svg{width:24px;height:24px}.bar{padding:8px 12px 2px}.prompt{font-size:clamp(18px,4.4vmin,30px)}}

.warm{position:fixed;inset:0;pointer-events:none;background:#ff9a3c;mix-blend-mode:multiply;opacity:.12;z-index:50}
.stage.top{justify-content:flex-start}
.rbtn.talking{animation:pulse .8s infinite;background:var(--sel-bg)}
.prompt.flash{animation:pop .5s;color:var(--yellow)}
.typein{width:min(62vmin,380px);font-family:var(--body);font-weight:700;font-size:min(8vmin,48px);text-align:center;letter-spacing:.12em;padding:8px 14px;border-radius:16px;border:4px solid var(--line);background:var(--paper);color:var(--ink);-webkit-user-select:text;user-select:text;outline:none}
.typein:focus{border-color:var(--blue)}
.typein::placeholder{color:var(--muted);letter-spacing:0;font-weight:400;font-size:.5em}
.entryrow{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.entryrow .go{padding:12px 26px}
.abc{display:grid;grid-template-columns:repeat(13,auto);gap:5px;justify-content:center}
.abc span{width:min(6.4vmin,40px);height:min(6.4vmin,40px);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:min(4.2vmin,24px);background:var(--paper);color:var(--muted)}
.abc span.g{background:var(--green);color:#fff}
.abc span.y{background:var(--yellow);color:#1f2a44}
.abc span.n{background:transparent;color:var(--grey);text-decoration:line-through}
.pstat{flex-basis:100%;margin:0;color:var(--muted)}
.tile .ico.molei{width:1.7em;height:1.7em;display:block}
.tile .ico.molei svg{width:100%;height:100%}
.tile .ico.molei .xeyes{display:none}
/* light up */
.pads{display:grid;grid-template-columns:repeat(2,auto);gap:min(4vmin,26px)}
.pad{width:min(32vmin,220px);height:min(32vmin,220px);border:0;cursor:pointer;opacity:.5;box-shadow:0 8px 0 rgba(0,0,0,.35);transition:opacity .08s,transform .08s,filter .08s;padding:0;touch-action:none}
.pad:nth-child(1){border-radius:100% 22px 22px 22px}
.pad:nth-child(2){border-radius:22px 100% 22px 22px}
.pad:nth-child(3){border-radius:22px 22px 22px 100%}
.pad:nth-child(4){border-radius:22px 22px 100% 22px}
.pad.lit{opacity:1;filter:brightness(1.3) saturate(1.2);transform:scale(1.05)}
/* brick bash */
.arena{position:relative;flex:1;width:100%;max-width:1000px;min-height:240px;border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:0 8px 0 var(--edge);touch-action:none}
.arena canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
/* mole pop */
.mhud{display:flex;gap:18px;align-items:center;justify-content:center;width:min(92vmin,640px)}
.msc{font-family:var(--display);font-weight:600;font-size:clamp(28px,6vmin,48px);min-width:2em;text-align:center}
.mbest{color:var(--muted);font-size:clamp(15px,3vmin,22px);white-space:nowrap}
.tbar{flex:1;height:18px;border-radius:9px;background:var(--cell);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left center;transition:transform .1s linear}
.field{display:grid;grid-template-columns:repeat(3,auto);gap:min(3vmin,22px);padding:min(3.5vmin,24px);border-radius:28px;background:var(--grass);box-shadow:0 8px 0 var(--edge)}
.hole{position:relative;width:min(24vmin,170px);height:min(24vmin,170px);cursor:pointer;touch-action:none}
.hole .pit{position:absolute;left:6%;right:6%;bottom:10%;height:24%;border-radius:50%;background:#1d130d}
.hole .win2{position:absolute;left:14%;right:14%;top:0;bottom:22%;overflow:hidden}
.hole .crit{position:absolute;left:0;right:0;bottom:0;height:100%;transform:translateY(105%);transition:transform .12s ease-out}
.hole .crit svg{width:100%;height:100%;display:block}
.hole.up .crit{transform:translateY(6%)}
.hole.hit .crit{transform:translateY(32%) scaleY(.85);transition:transform .08s}
.hole .crit .xeyes{display:none}
.hole.hit:not(.hog) .crit .eyes{display:none}
.hole.hit:not(.hog) .crit .xeyes{display:inline}
.hole .lip{position:absolute;left:6%;right:6%;bottom:10%;height:12%;border-radius:0 0 50% 50%/0 0 100% 100%;background:#7a4a2a}
.hole .pow{position:absolute;left:50%;top:0;font-family:var(--display);font-weight:600;font-size:min(6vmin,38px);color:var(--yellow);pointer-events:none;opacity:0;transform:translateX(-50%)}
.hole.hog .pow{color:var(--red)}
.hole.hit .pow{animation:powup .7s ease-out}
@keyframes powup{0%{opacity:0;transform:translate(-50%,10px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}

@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="warm" class="warm" aria-hidden="true"></div>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $app=document.getElementById('app');
function h(tag,props,kids){
  var e=document.createElement(tag),k;
  if(props){for(k in props){
    if(k==='class')e.className=props[k];
    else if(k==='html')e.innerHTML=props[k];
    else if(k==='text')e.textContent=props[k];
    else if(k==='style')e.style.cssText=props[k];
    else e.setAttribute(k,props[k]);
  }}
  (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function rnd(n){return Math.floor(Math.random()*n);}
function between(a,b){return a+rnd(b-a+1);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- settings (kept on this device only) ---------- */
var KEY='littlesparks.v2';
var S={diff:3,adapt:true,off:{},streak:{},voice:true,sfx:true,limit:20,day:'',used:0,bonus:0,theme:'dark',warm:true};
(function(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r){for(var k in r)S[k]=r[k];}}catch(e){}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){return new Date().toDateString();}
function rollDay(){if(S.day!==today()){S.day=today();S.used=0;S.bonus=0;save();}}
function limitReached(){rollDay();return S.limit>0&&S.used>=S.limit*60+S.bonus;}
/* one global difficulty (1 to 5); each game may drift one step either side of it */
function levelOf(id){return clamp(S.diff+(S.adapt?(S.off[id]||0):0),1,5);}
var DIFFNAME=['','Starter','Easy','Steady','Tricky','Expert'];

var screen='home';
setInterval(function(){
  if(screen!=='game'||document.hidden)return;
  rollDay();S.used++;if(S.used%10===0)save();
},1000);

/* ---------- sound and voice ---------- */
var ac=null;
function tone(f,t0,d,vol){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+0.05);
}
function audio(){
  if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();}
  if(ac.state==='suspended')ac.resume();
  return true;
}
/* xylophone notes for the music game: always sound, even with effects off */
var NOTES=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
function ping(i,long){
  try{
    if(!audio())return;
    var t=ac.currentTime,d=long?1.1:.7;
    [[1,.3,d],[4,.05,.18]].forEach(function(p){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=NOTES[i]*p[0];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(p[1],t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+p[2]+0.05);
    });
  }catch(e){}
}
function sfx(k){
  if(!S.sfx)return;
  try{
    if(!audio())return;
    var t=ac.currentTime;
    if(k==='good'){tone(660,t,.18);tone(880,t+.12,.26);}
    else if(k==='tick'){tone(700,t,.1);}
    else if(k==='soft'){tone(220,t,.16,.07);}
    else if(k==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,t+i*.13,.3);});}
  }catch(e){}
}
/* ---------- voice: uses the device's own speech engine ---------- */
var lastSpoken='',VOICE=null,voiceOK=null,keepU=[],earEl=null;
var HAS_TTS=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
function voiceList(){try{return window.speechSynthesis.getVoices()||[];}catch(e){return[];}}
function pickVoice(){
  var vs=voiceList();if(!vs.length)return;
  function L(v){return(v.lang||'').replace('_','-').toLowerCase();}
  function f(t){for(var i=0;i<vs.length;i++)if(t(vs[i]))return vs[i];return null;}
  VOICE=f(function(v){return L(v).indexOf('en-gb')===0&&v.localService;})||f(function(v){return L(v).indexOf('en-gb')===0;})||
    f(function(v){return L(v).indexOf('en')===0&&v.localService;})||f(function(v){return L(v).indexOf('en')===0;})||
    f(function(v){return v.default;})||vs[0];
}
if(HAS_TTS){
  pickVoice();
  try{window.speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){try{window.speechSynthesis.onvoiceschanged=pickVoice;}catch(x){}}
}
/* some browsers only allow speech after the first tap: say nothing once, silently, on that tap */
document.addEventListener('pointerdown',function unlock(){
  document.removeEventListener('pointerdown',unlock,true);
  if(!HAS_TTS)return;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;window.speechSynthesis.speak(u);}catch(e){}
},true);
function earTalk(on){if(earEl)earEl.classList.toggle('talking',!!on);}
function hush(){try{if(HAS_TTS)window.speechSynthesis.cancel();}catch(e){}earTalk(false);}
function noVoice(){
  if(!promptEl)return;
  promptEl.classList.remove('flash');void promptEl.offsetWidth;promptEl.classList.add('flash');
}
function say(text,tapped){
  if(!S.voice&&!tapped)return;
  if(!HAS_TTS){if(tapped)noVoice();return;}
  var ss=window.speechSynthesis,started=false;
  try{
    if(!VOICE)pickVoice();
    var u=new SpeechSynthesisUtterance(text);
    if(VOICE){u.voice=VOICE;u.lang=VOICE.lang;}else u.lang='en-GB';
    u.rate=.9;u.pitch=1.05;u.volume=1;
    u.onstart=function(){started=true;voiceOK=true;earTalk(true);};
    u.onend=function(){earTalk(false);};
    u.onerror=function(){earTalk(false);};
    keepU.push(u);if(keepU.length>6)keepU.shift();
    var go=function(){try{ss.speak(u);if(ss.paused)ss.resume();}catch(e){}};
    if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,120);}else go();
    if(tapped)setTimeout(function(){if(!started){voiceOK=false;noVoice();}},3000);
  }catch(e){if(tapped)noVoice();}
}

/* ---------- shapes ---------- */
var COL={red:'#ef5b4c',yellow:'#f6b93b',green:'#3fae6a',blue:'#3d8fe0',purple:'#8a63d2',pink:'#ee6fa0'};
var COLS=Object.keys(COL);
function poly(n,r,rot){var p=[];for(var i=0;i<n;i++){var a=rot+i*2*Math.PI/n;p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(){var p=[];for(var i=0;i<10;i++){var r=i%2?19:45,a=-Math.PI/2+i*Math.PI/5;p.push((50+r*Math.cos(a)).toFixed(1)+','+(52+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
var LITE=' fill="#fff" opacity=".38" stroke="none"',DARK=' fill="#000" opacity=".2" stroke="none"';
var SHAPE={
  circle:'<circle cx="50" cy="50" r="42"/>',
  square:'<rect x="11" y="11" width="78" height="78" rx="5"/>',
  triangle:'<polygon points="50,9 93,87 7,87"/>',
  rectangle:'<rect x="5" y="27" width="90" height="46" rx="5"/>',
  oval:'<ellipse cx="50" cy="50" rx="45" ry="28"/>',
  diamond:'<polygon points="50,5 84,50 50,95 16,50"/>',
  heart:'<path d="M50 88 C12 60 6 32 26 20 C38 13 48 20 50 31 C52 20 62 13 74 20 C94 32 88 60 50 88Z"/>',
  star:'<polygon points="'+starPts()+'"/>',
  pentagon:'<polygon points="'+poly(5,44,-Math.PI/2)+'"/>',
  hexagon:'<polygon points="'+poly(6,44,0)+'"/>',
  octagon:'<polygon points="'+poly(8,44,Math.PI/8)+'"/>',
  semicircle:'<path d="M8 68 A42 42 0 0 1 92 68 Z"/>',
  crescent:'<path d="M62 9.75 A42 42 0 1 0 62 90.25 A46 46 0 0 1 62 9.75Z"/>',
  cross:'<polygon points="36,8 64,8 64,36 92,36 92,64 64,64 64,92 36,92 36,64 8,64 8,36 36,36"/>',
  arrow:'<polygon points="8,38 56,38 56,16 94,50 56,84 56,62 8,62"/>',
  trapezium:'<polygon points="28,22 72,22 94,80 6,80"/>',
  parallelogram:'<polygon points="30,24 94,24 70,78 6,78"/>',
  kite:'<polygon points="50,5 80,38 50,95 20,38"/>',
  sphere:'<circle cx="50" cy="50" r="42"/><path d="M50 92 A42 42 0 0 0 92 50 A52 52 0 0 1 50 92Z"'+DARK+'/><ellipse cx="35" cy="33" rx="14" ry="8" transform="rotate(-35 35 33)"'+LITE+'/>',
  cube:'<rect x="12" y="34" width="56" height="56"/><polygon points="12,34 32,12 88,12 68,34"/><polygon points="12,34 32,12 88,12 68,34"'+LITE+'/><polygon points="68,34 88,12 88,68 68,90"/><polygon points="68,34 88,12 88,68 68,90"'+DARK+'/>',
  cuboid:'<rect x="5" y="44" width="68" height="36"/><polygon points="5,44 23,26 91,26 73,44"/><polygon points="5,44 23,26 91,26 73,44"'+LITE+'/><polygon points="73,44 91,26 91,62 73,80"/><polygon points="73,44 91,26 91,62 73,80"'+DARK+'/>',
  cylinder:'<path d="M22 24 V78 A28 11 0 0 0 78 78 V24Z"/><path d="M58 34 V88 A28 11 0 0 0 78 78 V24Z"'+DARK+'/><ellipse cx="50" cy="24" rx="28" ry="11"/><ellipse cx="50" cy="24" rx="28" ry="11"'+LITE+'/>',
  cone:'<path d="M50 8 L22 80 A28 10 0 0 0 78 80Z"/><path d="M50 8 L58 89 A28 10 0 0 0 78 80Z"'+DARK+'/>',
  pyramid:'<polygon points="50,10 10,82 60,92"/><polygon points="50,10 60,92 92,70"/><polygon points="50,10 60,92 92,70"'+DARK+'/>'
};
function shapeEl(name,colour,rot){
  return h('span',{class:'shape',html:'<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="'+(COL[colour]||colour)+'" stroke="rgba(31,42,68,.28)" stroke-width="2" stroke-linejoin="round"'+(rot?' transform="rotate('+rot+' 50 50)"':'')+'>'+SHAPE[name]+'</g></svg>'});
}

/* ---------- game shell ---------- */
var G=null,stageEl=null,promptEl=null,dotsEl=null;
var ICON={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>',
  ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
};
function setPrompt(text,spoken){promptEl.textContent=text;lastSpoken=spoken||text;say(lastSpoken);}
function drawDots(){
  dotsEl.innerHTML='';
  for(var i=0;i<G.total;i++)dotsEl.appendChild(h('i',{class:i<G.i?'on':''}));
}
function startGame(def){
  if(limitReached())return allDone();
  screen='game';
  G={def:def,level:levelOf(def.id),i:0,mistakes:0};
  G.total=def.rounds(G.level);
  buildShell();
  nextQ();
}
function homeButton(){
  var b=h('button',{class:'block go',type:'button',text:'Choose a game'});
  b.addEventListener('click',home);
  return b;
}
function buildShell(){
  $app.innerHTML='';
  var homeB=h('button',{class:'block rbtn',type:'button','aria-label':'Home',html:ICON.home});
  homeB.addEventListener('click',home);
  var earB=h('button',{class:'block rbtn',type:'button','aria-label':'Say it again',html:ICON.ear});
  earB.addEventListener('click',function(){say(lastSpoken,true);});earEl=earB;
  dotsEl=h('div',{class:'dots'});
  promptEl=h('p',{class:'prompt'});
  stageEl=h('div',{class:'stage'});
  $app.appendChild(h('div',{class:'bar'},[homeB,dotsEl,earB]));
  $app.appendChild(promptEl);
  $app.appendChild(stageEl);
}
function nextQ(){
  var g=G;
  if(g.i>=g.total)return roundEnd();
  stageEl.innerHTML='';drawDots();
  g.def.play(g.level,stageEl,function(wait){
    if(G!==g)return;
    g.i++;drawDots();
    setTimeout(function(){if(G===g)nextQ();},wait||900);
  });
}
/* each round walks a shuffled list of question types, so a round is always a mix */
function fromMix(list){
  if(!G.mix)G.mix=shuffle(list);
  return G.mix[G.i%G.mix.length];
}

/* tap-one-answer question used by several games */
function choiceQ(stage,o,done){
  setPrompt(o.prompt,o.spoken);
  if(o.show)stage.appendChild(o.show);
  var row=h('div',{class:'choices'+(o.choices.length===6?' c3':'')}),wrong=0,locked=false,g=G;
  o.choices.forEach(function(c){
    var b=h('button',{class:'block choice'+(c.wide?' wide':''),type:'button','aria-label':c.label},[c.node]);
    if(c.ok)b.setAttribute('data-ok','1');
    b.addEventListener('click',function(){
      if(locked||G!==g||b.disabled)return;
      if(c.ok){
        locked=true;b.classList.remove('hint');b.classList.add('right');sfx('good');
        if(o.after)o.after();
        done(o.wait);
      }else{
        wrong++;g.mistakes++;b.disabled=true;b.classList.add('nope');sfx('soft');
        if(wrong>=2){var ok=row.querySelector('[data-ok]');if(ok)ok.classList.add('hint');}
      }
    });
    row.appendChild(b);
  });
  stage.appendChild(row);
}

/* ---------- 1. Count it ---------- */
var THINGS=[['🍎','apples'],['⭐','stars'],['🐟','fish'],['⚽','balls'],['🐸','frogs'],['🚗','cars'],['🌳','trees'],['🐝','bees']];
var lastN=-1;
function groupEl(emojis,gone){
  var n=emojis.length,g=h('div',{class:'group'+(n>10?' many':''),style:'grid-template-columns:repeat('+Math.min(n,5)+',auto)'});
  emojis.forEach(function(e,i){g.appendChild(h('span',{class:gone&&i>=n-gone?'gone':'',text:e}));});
  return g;
}
function rep(e,n){var a=[];for(var i=0;i<n;i++)a.push(e);return a;}
function numChoices(n,cands,k){
  var seen={},c=[];seen[n]=1;
  cands.forEach(function(v){if(v>=0&&!seen[v]){seen[v]=1;c.push(v);}});
  for(var d=1;c.length<k-1;d++){[n+d,n-d].forEach(function(v){if(v>=0&&!seen[v]){seen[v]=1;c.push(v);}});}
  var out=sample(c,k-1);out.push(n);

var PADS=[{c:'green',f:392},{c:'red',f:523.25},{c:'yellow',f:659.25},{c:'blue',f:783.99}];
function padTone(i,dur){
  try{
    if(!audio())return;
    var t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
    o.type='triangle';o.frequency.value=PADS[i].f;
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(.34,t+.015);
    gn.gain.setValueAtTime(.34,t+dur*.7);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
function buzz(){
  try{
    if(!audio())return;
    var t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
    o.type='sawtooth';o.frequency.value=110;
    gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(.08,t+.02);gn.gain.exponentialRampToValueAtTime(0.0001,t+.35);
    o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+.4);
  }catch(e){}
}
var lightGame={id:'lights',name:'Light up',c:'orange',
  rounds:function(level){return[0,4,5,5,6,7][level];},
  play:function(level,stage,done){

    function add(){var n,k=0;do{n=rnd(4);}while(g.seq.length>=2&&n===g.seq[g.seq.length-1]&&n===g.seq[g.seq.length-2]&&++k<9);g.seq.push(n);}
    if(!g.seq){g.seq=[];for(i=0;i<start;i++)add();}else add();

var moleGame={id:'moles',name:'Mole pop',c:'lime',
  rounds:function(){return 1;},
  play:function(level,stage,done){
    var g=G,DUR=30000,upT=[0,1700,1400,1150,950,800][level],gap=[0,1000,850,700,580,480][level];

/* ---------- puzzles: a fresh layout every time, never the same one twice ---------- */
function dayNum(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}
function seeded(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function sshuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* each puzzle type walks its own counter: a finished puzzle, or one left over from yesterday, moves on to the next */

  var P=S.puz||(S.puz={}),p=P[id]||(P[id]={n:0,day:dayNum(),st:null}),d=dayNum();

/* typing goes through the device's own keyboard */
function typeBox(o){

/* A. Guess the word */
function scoreGuess(guess,word){
  var res=[],rem=word.split(''),i,k;
  for(i=0;i<word.length;i++){if(guess.charAt(i)===word.charAt(i)){res[i]='g';rem[i]=null;}else res[i]='n';}
  for(i=0;i<word.length;i++){if(res[i]!=='g'){k=rem.indexOf(guess.charAt(i));if(k>=0){res[i]='y';rem[k]=null;}}}
  return res;
}

var SETS=Object.keys(GARDEN).sort();
var gardenPuz={id:'garden',name:'Word garden',
  open:function(stage,p){
    var g=G,st=p.st;
    if(!st){
      var key=SETS[perm(SETS.length,1234)[p.n%SETS.length]],cm=GARDEN[key].split('|')[0].split(' ');
      st=p.st={set:key,goal:Math.min([0,3,3,4,5,6][S.diff],cm.length-1),found:[],done:false};
    }
    var set=st.set,mid=set.charAt(0),parts=GARDEN[set].split('|'),common=parts[0].split(' '),words=common.concat(parts[1]?parts[1].split(' '):[]);
    var GOAL=st.goal,cur='';
    stage.classList.add('top');
    var found=h('div',{class:'found'}),msg=note(),letters=h('div',{class:'gl'});
    var inp=typeBox({max:8,allow:set,label:'Type a word',onChange:function(v){cur=v;msg.textContent='';},onEnter:check});
    function paint(){
      found.innerHTML='';
      st.found.forEach(function(x){found.appendChild(h('span',{text:x}));});
      for(var i=st.found.length;i<GOAL;i++)found.appendChild(h('span',{class:'todo',text:'.'}));
    }
    function check(){
      if(G!==g||st.done)return;
      var bad='';
      if(cur.length<3)bad='Make it three letters or more.';
      else if(cur.indexOf(mid)<0)bad='Use the yellow letter too.';
      else if(st.found.indexOf(cur)>=0)bad='You have that one already.';
      else if(words.indexOf(cur)<0)bad='That is not a word I know.';
      if(bad){msg.textContent=bad;sfx('soft');inp.setValue('');return;}
      st.found.push(cur);say(cur);msg.textContent='';inp.setValue('');
      if(st.found.length>=GOAL)st.done=true;
      save();paint();
      if(st.done)setTimeout(function(){if(G===g)finish();},1100);else sfx('good');
    }
    var acts=actKeys(function(){if(G!==g||st.done)return;inp.setValue(cur.slice(0,-1));},check);
    function finish(){
      letters.style.display=acts.style.display=inp.style.display='none';inp.blur();
      var more=common.filter(function(x){return st.found.indexOf(x)<0;}).slice(0,6);
      msg.textContent=more.length?'Other words you could make: '+more.join(', ')+'.':'';
      setPrompt('Brilliant! You made '+GOAL+' words.');sfx('win');
      puzzleDone(gardenPuz,stage);
    }
    var order=sshuffle(set.slice(1).split(''),seeded(p.n+7));
    [order[0],order[1],mid,order[2],order[3]].forEach(function(l){
      var b=h('button',{class:'block ltile'+(l===mid?' mid':''),type:'button',text:l});
      b.addEventListener('click',function(){
        if(G!==g||st.done||cur.length>=8)return;
        inp.setValue(cur+l);sfx('tick');
      });
      letters.appendChild(b);
    });
    stage.appendChild(found);stage.appendChild(inp);stage.appendChild(msg);stage.appendChild(letters);stage.appendChild(acts);
    paint();
    setPrompt('Make '+GOAL+' words. Always use '+mid+'.');
  }
};

function holdButton(label,onOpen){
  var b=h('button',{class:'hold',type:'button'},[h('i'),h('b',{text:label})]),t=null;
  function stop(){clearTimeout(t);t=null;b.classList.remove('going');}
  function start(e){if(e)e.preventDefault();if(t)return;b.classList.add('going');t=setTimeout(function(){stop();onOpen();},3000);}
  b.addEventListener('pointerdown',start);
  b.addEventListener('pointerup',stop);b.addEventListener('pointerleave',stop);b.addEventListener('pointercancel',stop);
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
  b.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.repeat)start(e);});
  b.addEventListener('keyup',stop);
  return b;
}

function adapt(g){
  var id=g.def.id;
  if(S.adapt){
    var off=S.off[id]||0;
    if(g.mistakes<=1){
      S.streak[id]=(S.streak[id]||0)+1;
      if(S.streak[id]>=2&&off<1){S.off[id]=off+1;S.streak[id]=0;}
    }else{
      S.streak[id]=0;
      if(g.mistakes>=Math.max(4,g.total)&&off>-1)S.off[id]=off-1;
    }
  }
}
function roundEnd(){
  var g=G;
  if(g.def.id!=='moles')adapt(g);
  save();
  if(limitReached())return allDone();
  screen='end';G=null;
  $app.innerHTML='';
  var title=g.endTitle||'Well done!';
  sfx('win');say(title);
  var again=h('button',{class:'block go alt',type:'button',text:'Play again'});
  again.addEventListener('click',function(){startGame(g.def);});
  $app.appendChild(h('div',{class:'end'},[
    h('div',{class:'big',text:g.endIcon||'⭐'}),h('h2',{text:title}),
    g.endNote?h('p',{text:g.endNote}):null,
    h('div',{class:'endbtns'},[homeButton(),again])
  ]));
}

function segRow(label,opts,current,onPick){
  var seg=h('div',{class:'seg',role:'group','aria-label':label});
  opts.forEach(function(o){
    var b=h('button',{type:'button',class:'segb'+(o[0]===current?' on':''),text:o[1]});
    if(o[0]===current)b.setAttribute('aria-pressed','true');
    b.addEventListener('click',function(){onPick(o[0]);save();applyTheme();parent();});
    seg.appendChild(b);
  });
  return h('div',{class:'prow'},[h('span',{class:'plabel',text:label}),seg]);
}
function voiceStatus(){

  if(voiceOK===false)return'The last test did not start. Check the volume, then try again.';
  if(!vs.length)return'No voices found yet. Tap Test voice.';
  return vs.length+' voice'+(vs.length>1?'s':'')+' found'+(VOICE?'. Using '+VOICE.name+'.':'.');

  w.appendChild(segRow('Sound effects',[[true,'On'],[false,'Off']],S.sfx,function(v){S.sfx=v;}));
  var stat=h('p',{class:'pstat',text:voiceStatus()});
  var test=h('button',{class:'segb',type:'button',text:'Test voice'});
  test.addEventListener('click',function(){
    say('Hello! I will read the questions out loud.',true);
    setTimeout(function(){if(screen==='parent')stat.textContent=voiceStatus();},3200);
  });
  w.appendChild(h('div',{class:'prow'},[h('span',{class:'plabel',text:'Voice check'}),test,stat]));
  w.appendChild(h('p',{text:'The speaker button in every game reads the question again, even when reading aloud is off.'}));
  var B=S.best||{},bl=[1,2,3,4,5].filter(function(l){return B[l];}).map(function(l){return'level '+l+': '+B[l];});
  w.appendChild(h('h3',{text:'Mole pop best scores'}));
  w.appendChild(h('p',{text:bl.length?bl.join(', ')+'.':'No scores yet.'}));
  var back=h('button',{class:'block go',type:'button',text:'Back to the games'});
  back.addEventListener('click',home);
  w.appendChild(back);
  $app.appendChild(w);
  w.scrollTop=keep;
}
function applyTheme(){
  document.documentElement.setAttribute('data-mode',S.theme==='light'?'light':'dark');
  var wm=document.getElementById('warm');if(wm)wm.style.display=S.warm?'block':'none';
}

applyTheme();
home();
/* installed app: work offline, and ask the browser to keep her progress */
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
</script>
