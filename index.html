<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#151b2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Little Sparks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a table of chunky wooden blocks on a pale board. One screen, no scrolling during play. */
:root{
  color-scheme: dark;
  --board:#151b2b; --paper:#252e45; --ink:#f2e9d6; --muted:#a7aec2; --edge:#0b0f1a; --line:#3a4562;
  --good-bg:#1d4a33; --sel-bg:#1e3a5f; --lit-bg:#5a4716; --cell:#323c57; --grey:#5d6782; --grey-d:#454e66;
  --act:#f2e9d6; --act-ink:#151b2b; --grass:#22402c;
  --red:#e0584b;   --red-d:#a93a2f;
  --yellow:#e8b13f;--yellow-d:#a8781a;
  --green:#3ea567; --green-d:#277447;
  --blue:#3f86d4;  --blue-d:#295f9c;
  --purple:#8461c9;--purple-d:#5c4196;
  --pink:#dc6896;  --pink-d:#a7466d;
  --orange:#e2843e;--orange-d:#a95e22;
  --teal:#24a09b;  --teal-d:#167370;
  --indigo:#5d6fd9;--indigo-d:#3f4fa6;
  --lime:#7aa83a;  --lime-d:#557724;
  --sky:#2f95cc;   --sky-d:#1f6c96;
  --brown:#9a6a3c; --brown-d:#6c4823;
  --magenta:#b9548f;--magenta-d:#863a66;
  --olive:#8d8a2f;--olive-d:#646220;
  --cyan:#2a8fa8;--cyan-d:#1d6577;
  --bad-bg:#4a2430;
  --forest:#4f8f45; --forest-d:#35662e;
  --display:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Andika","Comic Sans MS","Trebuchet MS",sans-serif; /* infant letterforms: single-storey a and g */
}
/* layout idea unchanged: chunky blocks on a board. Dark is the default; light is a grown-ups option */
:root[data-mode="light"]{
  color-scheme: light;
  --board:#e4f1ee; --paper:#ffffff; --ink:#1f2a44; --muted:#5d6b85; --edge:#c3d3d6; --line:#c3d3d6;
  --good-bg:var(--good-bg); --sel-bg:var(--sel-bg); --lit-bg:var(--lit-bg); --cell:var(--cell); --grey:#9aa7b8; --grey-d:#7c8a9c;
  --act:#1f2a44; --act-ink:#ffffff; --grass:#a8d8a0;
  --red:#ef5b4c;   --red-d:#b93c30;
  --yellow:#f6b93b;--yellow-d:#c28a14;
  --green:#3fae6a; --green-d:#2a7f4a;
  --blue:#3d8fe0;  --blue-d:#2867ab;
  --purple:#8a63d2;--purple-d:#6243a3;
  --pink:#ee6fa0;  --pink-d:#bd4675;
  --orange:#f08a3c;--orange-d:#b9621f;
  --teal:#22a6a1;  --teal-d:#14787a;
  --indigo:#5b6ee1;--indigo-d:#3f4fb0;
  --lime:#86b83f;  --lime-d:#5d8327;
  --sky:#37a6e0;   --sky-d:#2479a8;
  --brown:#a8743f; --brown-d:#7a5226;
  --magenta:#c45a98;--magenta-d:#913f6f;
  --olive:#9b9833;--olive-d:#6e6c23;
  --cyan:#2e9ab5;--cyan-d:#206d80;
  --bad-bg:#fbd9d4;
  --forest:#56994a; --forest-d:#3a6d32;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--board);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:pan-y;overscroll-behavior:none;overflow:hidden;
}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* the block: the one bold element everything is built from */
.block{
  border:0;border-radius:22px;background:var(--paper);cursor:pointer;
  box-shadow:0 8px 0 var(--edge),0 12px 20px rgba(31,42,68,.10);
  transition:transform .08s,box-shadow .08s,opacity .2s;
}
.block:active{transform:translateY(6px);box-shadow:0 2px 0 var(--edge)}
.block:disabled{cursor:default}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;gap:18px;padding:20px 20px 16px;min-height:0}
.home h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,6.5vmin,56px);margin:0;letter-spacing:.01em}
.home h1 span{color:var(--red)}
.tiles{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-height:0;padding-bottom:10px}
@media (orientation:landscape){.tiles{grid-template-columns:repeat(6,1fr)}}

.tile .ico.dogico{width:1.9em;height:1.9em;display:block}
.tile .ico.dogico svg{width:100%;height:100%}

/* ---------- my dog ---------- */
.scene{position:relative;width:min(90vmin,620px);height:min(58vmin,400px);flex:none;border-radius:28px;background:#fdf0cf;overflow:hidden;box-shadow:0 8px 0 var(--edge)}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:26%;background:#e2b98a}
.scene .win{position:absolute;left:6%;top:10%;width:19%;height:32%;background:#cfeaf7;border:6px solid #fff;border-radius:12px;box-shadow:0 3px 0 var(--edge)}
.scene .win:after{content:"";position:absolute;right:14%;top:14%;width:34%;height:34%;border-radius:50%;background:#f6b93b}
.scene.night .win{background:#27325a}
.scene.night .win:after{background:#fdf0cf}
.scene.out{background:#cfeaf7}
.scene.out .win{left:auto;right:8%;top:8%;width:15%;height:22%;border:0;background:none;box-shadow:none}
.scene.out .win:after{right:0;top:0;width:100%;height:100%}
.scene.out .floor{left:-12%;right:-12%;height:30%;background:#7cc77f;border-radius:50% 50% 0 0/45% 45% 0 0}
.dog{position:absolute;left:0;right:0;bottom:2%;height:94%;display:flex;justify-content:center;pointer-events:none}
.dog svg{height:100%;width:auto;display:block;overflow:visible}
.dog .x{display:none}
.dog .tail{transform-origin:196px 236px;animation:wag .5s ease-in-out infinite alternate}
.dog .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.dog.s-hungry .rumble,.dog.s-hungry .brows,.dog.s-thirsty .tongue,.dog.s-thirsty .drops,.dog.s-thirsty .brows,
.dog.s-dirty .mud,.dog.s-dirty .brows,.dog.s-scruffy .tufts,.dog.s-scruffy .brows,.dog.s-play .woof,.dog.s-play .tongue,
.dog.s-walk .leadm,.dog.s-sleepy .lids,.dog.s-sleepy .zzz,.dog.s-poop .brows,
.dog.happy .hearts,.dog.happy .tongue,.dog.happy .smile,.dog.a-bath .bubbles,.dog.a-brush .sparkle,.dog.a-bath .sparkle,
.dog.asleep .lids,.dog.asleep .zzz,.dog.asleep .bedx{display:inline}
.dog.s-sleepy .eye,.dog.asleep .eye,.dog.happy .eye{display:none}
.dog.s-thirsty .tongue{transform-origin:150px 140px;animation:pant .3s infinite alternate}
.dog.s-hungry .rumble{animation:fade .6s infinite alternate}
.dog.s-play svg,.dog.a-ball svg,.dog.a-lead svg{animation:hop .32s ease-out infinite alternate}
.dog.s-walk .head{transform-origin:150px 160px;animation:tilt 1.2s ease-in-out infinite alternate}
.dog.happy .tail,.dog.s-play .tail{animation-duration:.16s}
.dog.happy .hearts{animation:rise 1.6s ease-out infinite}
.dog.asleep .tail{animation:none}
.dog .zzz{animation:fade 1.2s infinite alternate}
.prop{position:absolute;left:5%;bottom:5%;width:23%}
.prop.r{left:auto;right:6%}
.prop svg{width:100%;display:block;overflow:visible}
.prop.bounce svg{animation:hop .3s ease-out infinite alternate}
.bubble{position:absolute;right:4%;top:6%;width:24%;background:#fff;border-radius:50%;padding:3%;box-shadow:0 4px 0 var(--edge)}
.bubble svg{width:100%;display:block}
.tray{display:grid;gap:14px;justify-content:center}
.tool{width:min(17vmin,130px);height:min(17vmin,130px);padding:8%;display:grid;place-items:center}
.tool svg{width:100%;height:100%;display:block;overflow:visible}
.tool.hint{animation:pulse 1s infinite}
.kib{display:flex;gap:8px;justify-content:center;min-height:30px;flex-wrap:wrap}
.kib i{width:26px;height:26px;border-radius:50%;background:#a9713f;display:block}
.coats{display:flex;gap:16px;justify-content:center}
.coat{width:64px;height:64px;border-radius:50%;border:5px solid var(--paper);box-shadow:0 0 0 3px var(--line);cursor:pointer;padding:0}
.coat.on{box-shadow:0 0 0 5px var(--ink)}
.nameline{min-width:min(60vmin,420px);min-height:min(13vmin,92px);border-bottom:5px solid var(--ink);text-align:center;font-weight:700;font-size:min(10vmin,72px);line-height:1.2}
.scene.small{width:min(46vmin,300px);height:min(40vmin,260px)}

/* ---------- tunes ---------- */
.xylo{display:flex;align-items:flex-end;justify-content:center;gap:1.6vmin;height:min(50vmin,380px);flex:none}
.xbar{width:min(9.6vmin,76px);border:0;border-radius:14px;box-shadow:0 6px 0 rgba(31,42,68,.28);cursor:pointer;padding:0;transition:transform .08s,filter .08s}
.xbar:disabled{opacity:.16;cursor:default}
.xbar.lit{transform:translateY(-12px) scale(1.05);filter:brightness(1.3)}
.xbar.next{outline:6px solid var(--ink);outline-offset:3px;animation:pulse .8s infinite}
.choice.lit{background:var(--lit-bg);transform:scale(1.08)}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pant{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6%)}}
@keyframes tilt{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes fade{from{opacity:.25}to{opacity:1}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:var(--c);box-shadow:0 8px 0 var(--cd),0 12px 20px rgba(31,42,68,.12);
  color:#fff;min-height:0;padding:10px;
}
.tile:active{box-shadow:0 2px 0 var(--cd)}
.tile .ico{font-family:var(--body);font-weight:700;font-size:clamp(28px,8vmin,64px);line-height:1;display:flex;gap:.18em;align-items:center}
.tile .ico svg{width:1em;height:1em}
.tile .nm{font-family:var(--display);font-weight:500;font-size:clamp(16px,3.4vmin,26px);text-align:center;line-height:1.15}
.homefoot{display:flex;justify-content:flex-end}
.lbl{font-family:var(--display);font-weight:500;font-size:clamp(16px,3vmin,22px);color:var(--muted);margin:0 0 -8px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:10px}
.dtile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 6px;color:var(--ink)}
.dtile .ico{display:flex;gap:5px}
.dtile .ico i{width:clamp(16px,4.4vmin,34px);height:clamp(16px,4.4vmin,34px);border-radius:7px;display:block}
.dtile .nm{font-family:var(--display);font-weight:500;font-size:clamp(14px,3.2vmin,24px);text-align:center;line-height:1.15}
.dtile.fin{background:var(--good-bg);box-shadow:0 8px 0 var(--green),0 12px 20px rgba(31,42,68,.10)}
.dtile .tick{position:absolute;top:8px;right:10px;font-family:var(--display);color:var(--green-d);font-size:clamp(14px,3vmin,22px)}

/* hold-to-open for grown-ups */
.hold{
  position:relative;overflow:hidden;border:2px solid var(--line);background:transparent;border-radius:999px;
  padding:8px 16px;min-height:44px;font-size:15px;color:var(--muted);cursor:pointer;
}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cell);z-index:0}
.hold.going i{width:100%;transition:width 3s linear}
.hold b{position:relative;font-weight:400;z-index:1}

/* ---------- game shell ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.rbtn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none}
.rbtn svg{width:30px;height:30px}
.dots{flex:1;display:flex;justify-content:center;gap:10px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--cell)}
.dots i.on{background:var(--green)}
.prompt{font-family:var(--display);font-weight:500;text-align:center;font-size:clamp(22px,5vmin,40px);padding:4px 16px 0;margin:0;text-wrap:balance}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:16px;padding:12px 16px 24px;overflow:auto}

.show{display:flex;align-items:center;justify-content:center;gap:4vmin;flex-wrap:wrap}
.show.col{flex-direction:column;gap:2vmin}
.pic{font-size:min(24vmin,170px);line-height:1.1;background:none;border:0;padding:0;cursor:pointer}
.group{display:grid;gap:1vmin 1.6vmin;font-size:min(9vmin,66px);line-height:1.15}
.group.many{font-size:min(6.6vmin,48px);gap:.4vmin 1.4vmin}
.group .gone{opacity:.22;position:relative}
.group .gone:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:5px solid var(--red);transform:rotate(-35deg)}
.plus{font-family:var(--display);font-size:min(12vmin,80px);color:var(--muted)}
.eq{font-weight:700;font-size:min(15vmin,110px);line-height:1.1;letter-spacing:.04em}
.nums{display:flex;gap:1.6vmin;justify-content:center}
.nums div{width:min(15vmin,110px);height:min(15vmin,110px);border-radius:18px;background:var(--paper);box-shadow:0 6px 0 var(--edge);display:grid;place-items:center;font-weight:700;font-size:min(8vmin,58px)}
.nums div.q{background:transparent;box-shadow:none;border:4px dashed var(--muted);color:var(--muted)}

.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.choices.c3{display:grid;grid-template-columns:repeat(3,auto)}
.choice{width:min(21vmin,170px);height:min(21vmin,170px);display:grid;place-items:center;padding:8px}
.choice.wide{width:auto;height:auto;min-width:min(34vmin,240px);padding:14px 22px}
.choice.wide .group{font-size:min(6vmin,44px)}
.choice .num,.choice .ltr{font-weight:700;font-size:min(12vmin,96px);line-height:1}
.choice .wordtxt{font-weight:700;font-size:min(9vmin,64px);line-height:1.2}
.choice .shape{width:78%;height:78%}
.shape{display:block}
.shape svg{width:100%;height:100%;display:block}
.choice.right{background:var(--good-bg);box-shadow:0 8px 0 var(--green),0 12px 20px rgba(31,42,68,.10);animation:pop .45s}
.choice.nope{opacity:.3;animation:shake .35s}
.choice.hint{animation:pulse 1s infinite}

/* pattern row */
.seq{display:flex;gap:1.6vmin;align-items:center;justify-content:center;flex-wrap:nowrap}
.seq .cell{width:min(10vmin,84px);height:min(10vmin,84px);flex:none}
.seq .gap{border:4px dashed var(--muted);border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:min(7vmin,54px);color:var(--muted)}
.seq .gap.filled{border-color:transparent}
.seq .gap .shape{width:100%;height:100%}

/* spelling */
.slots{display:flex;gap:12px}
.slot,.ltile{width:min(17vmin,130px);height:min(17vmin,130px);font-weight:700;font-size:min(11vmin,88px);line-height:1;display:grid;place-items:center;padding:0}
.five .slot,.five .ltile{width:min(14.5vmin,112px);height:min(14.5vmin,112px);font-size:min(9.5vmin,74px)}
.slot{border-radius:18px;border:4px dashed var(--muted)}
.slot.filled{border:4px solid var(--green);background:var(--good-bg)}
.ltile.used{opacity:.15}
.shake{animation:shake .35s}

/* pairs */
.cards{display:grid;gap:12px}
.card{line-height:1;display:grid;place-items:center;padding:0;background:var(--purple);box-shadow:0 6px 0 var(--purple-d);border-radius:16px;font-weight:700}
.card span{visibility:hidden}
.card.up{background:var(--paper);box-shadow:0 6px 0 var(--edge)}
.card.up span{visibility:visible}
.card.gone{background:var(--good-bg);box-shadow:0 6px 0 var(--green)}

/* copy it */
.copy{display:flex;gap:4vmin;align-items:center;justify-content:center;flex-wrap:wrap}
.copy.mirror{flex-wrap:nowrap;gap:2vmin}
.copy.stack{flex-direction:column;flex-wrap:nowrap;gap:12px}
@media (orientation:portrait){.choice{width:min(24vw,170px);height:min(24vw,170px)}.choice .num,.choice .ltr{font-size:min(13vw,96px)}}
.mline{align-self:stretch;border-left:5px dashed var(--muted)}
.gridbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.gridbox .cap{font-family:var(--display);font-size:clamp(16px,3.2vmin,24px);color:var(--muted)}
.grid{display:grid;gap:5px;background:var(--paper);padding:9px;border-radius:20px;box-shadow:0 8px 0 var(--edge)}
.grid button,.grid div{border-radius:9px;border:0;background:var(--cell);padding:0}
.grid button{cursor:pointer}
.grid.done{box-shadow:0 8px 0 var(--green);animation:pop .45s}
.paints{display:flex;gap:16px}
.paints.col{flex-direction:column;margin-left:8px}
.paint{width:64px;height:64px;border-radius:50%;border:5px solid var(--paper);box-shadow:0 0 0 3px var(--line);cursor:pointer;padding:0}
.paint.on{box-shadow:0 0 0 5px var(--ink)}

/* daily: word of the day */
.wboard{display:grid;gap:8px}
.wrow{display:flex;gap:8px}
.wcell{width:min(9vmin,64px);height:min(9vmin,64px);border-radius:12px;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:min(6vmin,42px);line-height:1}
.wcell.g{background:var(--green);border-color:var(--green-d);color:#fff}
.wcell.y{background:var(--yellow);border-color:var(--yellow-d);color:#1f2a44}
.wcell.n{background:var(--grey);border-color:var(--grey-d);color:#fff}
.keys{display:grid;grid-template-columns:repeat(7,auto);gap:6px;justify-content:center}
.key{width:min(11vmin,80px);height:min(10vmin,70px);border-radius:12px;border:0;background:var(--paper);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:min(6vmin,40px);line-height:1;cursor:pointer;padding:0}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.key.g{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.key.y{background:var(--yellow);color:#1f2a44;box-shadow:0 4px 0 var(--yellow-d)}
.key.n{background:var(--grey);color:#fff;box-shadow:0 4px 0 var(--grey-d)}
.key.act{width:min(24vmin,170px);background:var(--act);color:var(--act-ink);box-shadow:0 4px 0 var(--edge);font-family:var(--display);font-size:min(4.4vmin,28px)}
.acts{display:flex;gap:20px;justify-content:center}
.note{font-size:clamp(16px,3.4vmin,24px);color:var(--muted);min-height:1.4em;text-align:center;margin:0}
.cluepic{font-size:min(14vmin,96px);line-height:1}

/* daily: sort it */
.bands{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px}
.band{border-radius:18px;padding:10px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;animation:pop .45s}
.band b{font-family:var(--display);font-weight:500;font-size:clamp(18px,4vmin,28px)}
.band span{font-size:min(8vmin,50px);line-height:1}
.sgrid{display:grid;grid-template-columns:repeat(3,auto);gap:16px}
.sgrid.c4{grid-template-columns:repeat(4,auto);gap:12px}
.stile{width:min(22vmin,160px);height:min(22vmin,160px);font-size:min(13vmin,96px);line-height:1;display:grid;place-items:center;padding:0}
.c4 .stile{width:min(18vmin,136px);height:min(18vmin,136px);font-size:min(11vmin,80px)}
.stile.sel{background:var(--sel-bg);box-shadow:0 8px 0 var(--blue),0 12px 20px rgba(31,42,68,.10)}

/* daily: word garden */
.found{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px}
.found span{background:var(--good-bg);border:2px solid var(--green);border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(18px,4vmin,28px)}
.found span.todo{background:transparent;border:2px dashed var(--muted);color:transparent;min-width:3.2em}
.entry{min-width:min(60vmin,420px);min-height:min(15vmin,104px);border-bottom:5px solid var(--ink);text-align:center;font-weight:700;font-size:min(12vmin,88px);line-height:1.15;letter-spacing:.06em}
.gl{display:flex;gap:12px;justify-content:center}
.gl .ltile{width:min(15.5vmin,120px);height:min(15.5vmin,120px);font-size:min(10vmin,80px)}
.gl .ltile.mid{color:#1f2a44;background:var(--yellow);box-shadow:0 8px 0 var(--yellow-d),0 12px 20px rgba(31,42,68,.10)}

/* end screens */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
.end .big{font-size:min(34vmin,220px);line-height:1;animation:pop .6s}

.endbtns{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.go{padding:18px 34px;font-family:var(--display);font-size:clamp(20px,4vmin,30px);color:#fff;background:var(--blue);box-shadow:0 8px 0 var(--blue-d)}
.go:active{box-shadow:0 2px 0 var(--blue-d)}
.go.alt{background:var(--paper);color:var(--ink);box-shadow:0 8px 0 var(--edge)}

/* grown-ups panel */
.parent{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px;max-width:760px;width:100%;margin:0 auto;font-size:17px}
.parent h2{font-family:var(--display);font-weight:600;font-size:30px;margin:0}
.parent h3{font-family:var(--display);font-weight:500;font-size:20px;margin:10px 0 0}
.parent p{margin:0;color:var(--muted);max-width:65ch}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--paper);border-radius:16px;padding:12px 14px}
.plabel{font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:15px}
.segb.on{background:var(--ink);border-color:var(--ink);color:var(--board)}
.parent .go{align-self:flex-start;font-size:20px;padding:14px 28px}

/* ---------- v3 additions ---------- */
/* balloon pop */
.stage.balst .arena{flex:1}
.arena.sky{background:linear-gradient(#bfe3ff,#e9f6ff)}
:root:not([data-mode="light"]) .arena.sky{background:linear-gradient(#1d2a4a,#2b3b63)}
.arena>.go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5}
.btarget{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 6px;border-radius:999px;background:var(--cell);font-weight:700;font-size:clamp(16px,3.6vmin,22px);color:var(--ink)}
.bchip{width:26px;height:30px;border-radius:50% 50% 48% 48%;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.btarget.swap{animation:pulse .5s 3}
.stage.balst .mhud{gap:12px;flex-wrap:wrap}

/* home: category doors */
.doors{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px}
.doors.row4{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.door{height:auto!important;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.door .doorico{font-size:clamp(44px,14vmin,110px);line-height:1}
.door .nm{font-family:var(--display);font-weight:500;font-size:clamp(17px,4.4vmin,30px);line-height:1.15;text-align:center}
.door .doorsub{font-size:clamp(12px,2.8vmin,17px);opacity:.85}
.door.rest{filter:saturate(.35) brightness(.8)}
.catscreen{height:100%;display:flex;flex-direction:column;padding:12px 16px 18px;gap:12px}
.cathead{display:flex;align-items:center;gap:12px;flex:none}
.cattitle{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:500;font-size:clamp(20px,5vmin,32px);color:var(--ink)}
.iconspacer{width:56px;flex:none}
.catgrid{flex:1;min-height:0;display:grid;gap:14px}
.catgrid .htile{height:auto!important;min-height:0;min-width:0}
.catgrid .htile .ico{height:calc(var(--th)*.42);font-size:calc(var(--th)*.3);white-space:nowrap}
.catgrid .htile .ico svg{height:100%;width:auto;max-width:80%}
.catgrid .htile .nm{font-size:clamp(15px,calc(var(--th)*.13),26px);line-height:1.15;padding:0 6px;text-align:center}

/* touch feedback */
.block.pressed{transform:translateY(5px);filter:brightness(.92)}
.wkey.pressed{transform:translateY(2px);filter:brightness(1.25)}
button{touch-action:manipulation}
/* home: one row per category, revolving arrows, no scrolling */
.hubbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:14px 16px 16px;overflow:hidden}
.advtile{flex:none;flex-direction:row!important;gap:14px;height:auto!important;padding:10px 18px;justify-content:center;background:linear-gradient(120deg,var(--orange),var(--magenta));box-shadow:0 7px 0 var(--magenta-d);color:#fff}
.advtile.fin{background:linear-gradient(120deg,var(--green),var(--teal));box-shadow:0 7px 0 var(--teal-d)}
.advtile .advicons{font-size:clamp(20px,4.4vmin,34px);letter-spacing:.05em}
.advtxt{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.advtile .nm{font-family:var(--display);font-weight:500;font-size:clamp(17px,3.6vmin,26px)}
.advtile .advsub{font-size:clamp(12px,2.6vmin,17px);opacity:.92}
.cats{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.cat{display:flex;flex-direction:column;gap:6px;min-height:0}
.catlbl{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:500;font-size:clamp(15px,3.2vmin,20px);color:var(--muted)}
.landcats .cat{flex-direction:row;align-items:center;gap:12px}
.landcats .catlbl{width:138px;flex:none;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.15}
.caticon{font-size:1.25em}
.catrow{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.cattiles{flex:1;min-width:0;display:grid;gap:12px}
.cattiles .htile{height:var(--th)!important;min-width:0}
.cattiles .htile .ico{height:calc(var(--th)*.36);font-size:calc(var(--th)*.3)}
.cattiles .htile .nm{font-size:clamp(13px,calc(var(--th)*.15),22px)}
.cattiles.slidel{animation:slidel .3s ease-out}
.cattiles.slider{animation:slider .3s ease-out}
@keyframes slidel{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slider{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.catarrow{flex:none;width:clamp(44px,calc(var(--th)*.45),56px);height:clamp(44px,calc(var(--th)*.45),56px);border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink)}
.catarrow svg{width:55%;height:55%}
.cat.port .catrow{gap:8px}.cat.port .cattiles{gap:8px}.cat.port .catarrow{width:44px;height:44px}
.cat.port .htile .nm{font-size:clamp(13px,calc(var(--th)*.13),19px);line-height:1.1;padding:0 4px}
.advtile .advicons{white-space:nowrap}
.htile .gobadge{position:absolute;top:6px;left:8px;font-size:clamp(11px,2.2vmin,14px);background:rgba(0,0,0,.28);color:#fff;border-radius:999px;padding:1px 8px}
@media (prefers-reduced-motion:reduce){.cattiles.slidel,.cattiles.slider{animation:none}}
/* guess the word: result layout */
.wlay.result{flex-wrap:nowrap}
.wlay.result:not(.side){flex-direction:column}
.wlay.result.side .wside{flex:1;min-width:0;max-width:50%}
.wlay.result .sentence{max-width:100%}
.wkr{gap:5px}
.wkb{gap:5px}
.wkey.wide{width:calc(var(--k,44px)*1.45)}
/* shopping trolley */
.cart{display:flex;flex-direction:column;align-items:center;width:min(92vw,440px)}
.basketwrap{position:relative;width:100%}
.basket{min-height:min(18vw,84px);border:5px solid var(--muted);border-top:0;border-radius:0 0 18px 18px;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(167,174,194,.18) 18px 21px);display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:4px;padding:6px 10px}
.basket .item{font-size:min(10vw,52px);line-height:1.1}
.cloth{position:absolute;inset:-4px -6px 0;border-radius:6px 6px 18px 18px;background:repeating-linear-gradient(45deg,var(--blue) 0 14px,var(--sky) 14px 28px);opacity:0;transform:scaleY(.2);transform-origin:top;transition:opacity .35s,transform .35s;pointer-events:none}
.cloth.on{opacity:1;transform:none}
.cartbase{width:100%}
.cartbase svg{width:100%;display:block}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(20vw,96px),1fr));gap:12px;width:min(96vw,620px)}
.choice.food{width:auto;height:auto;aspect-ratio:1}
.choice.food .item{font-size:min(10vw,52px);line-height:1}
/* spot the difference */
.spotwrap{display:flex;gap:16px;justify-content:center;align-items:center}
.spotwrap.stack{flex-direction:column;gap:12px}
.spotpic{border-radius:14px;overflow:hidden;box-shadow:0 6px 0 var(--edge);touch-action:none;cursor:pointer}
.spotpic svg{width:100%;height:100%;display:block}
.spotpic .ring{fill:none;stroke:#e0584b;stroke-width:2.2}
.spotpic .hint{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:3 2;animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
.spotpic .miss{fill:rgba(224,88,75,.5)}
.stage.spotst{gap:10px}

.addlbl{font-size:clamp(14px,2.8vmin,18px)!important;margin-top:8px!important}
.addtime{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.addtime .hold{padding:14px 22px;font-size:clamp(16px,3vmin,20px);border-width:3px;color:var(--ink)}

.phead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;position:sticky;top:-20px;margin:-20px -20px 0;padding:16px 20px 12px;background:var(--board);z-index:2;box-shadow:0 8px 14px -10px rgba(0,0,0,.6)}
.phead .go{padding:12px 24px;font-size:clamp(17px,3vmin,22px)}

/* wrong answers: clear signal, then a new option grows in the same place */
.choice.wrongflash,.ltile.wrongflash{background:var(--bad-bg);box-shadow:0 8px 0 var(--red-d);animation:shake .42s 2;position:relative}
.choice.wrongflash::after,.ltile.wrongflash::after{content:"✗";position:absolute;top:2px;right:8px;font-family:var(--display);font-weight:600;font-size:min(6vmin,32px);line-height:1;color:var(--red)}
.newin{animation:newin .5s ease-out}
@keyframes newin{0%{transform:scale(.2) rotate(-10deg);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
/* difficulty slider in the header */
.dslider{flex:1;max-width:420px;display:flex;align-items:center;gap:12px;margin:0 8px}
.dtitle{font-family:var(--display);font-size:clamp(14px,2.6vmin,18px);color:var(--muted);white-space:nowrap}
.dtrack{position:relative;flex:1;height:58px}
.dtrack input{position:absolute;left:0;right:0;top:4px;width:100%;margin:0;height:32px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:pan-x}
.dtrack input::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red))}
.dtrack input::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red))}
.dtrack input::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-11px;border-radius:50%;background:var(--ink);border:4px solid var(--board);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dtrack input::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--ink);border:4px solid var(--board)}
.dtrack input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.dmarks{position:absolute;left:0;right:0;top:34px;height:22px}
.dmark{position:absolute;top:0;transform:translateX(-50%);border:0;background:none;padding:6px 4px 8px;min-width:44px;font:inherit;font-size:clamp(11px,2.1vmin,14px);color:var(--muted);cursor:pointer;white-space:nowrap}
.dmark::before{content:"";position:absolute;top:-9px;left:50%;width:3px;height:7px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.dmark.on{color:var(--ink);font-weight:700}
.dmark.on::before{background:var(--ink)}
.hubhead{flex-wrap:wrap}
@media (max-width:640px){.dslider{order:3;flex-basis:100%;max-width:none;margin:2px 0 0}}

/* today's adventure */
.htile.advtile{grid-column:1/-1;height:clamp(118px,21vmin,160px);background:linear-gradient(120deg,var(--orange),var(--magenta));box-shadow:0 8px 0 var(--magenta-d),0 12px 20px rgba(31,42,68,.12);color:#fff;gap:4px}
.htile.advtile.fin{background:linear-gradient(120deg,var(--green),var(--teal));box-shadow:0 8px 0 var(--teal-d)}
.advicons{font-size:clamp(26px,5.5vmin,44px);letter-spacing:.12em;line-height:1}
.advsub{font-size:clamp(14px,2.8vmin,20px);opacity:.92}
.advpath{display:flex;align-items:flex-start;justify-content:center;gap:0;width:100%;max-width:820px}
.advstop{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.advstop:not(:last-child)::after{content:"";position:absolute;top:calc(min(13vmin,80px)/2);left:calc(50% + min(13vmin,80px)/2 + 4px);right:calc(-50% + min(13vmin,80px)/2 + 4px);border-top:5px dashed var(--line)}
.advstop.done:not(:last-child)::after{border-top-style:solid;border-color:var(--green)}
.advstone{width:min(13vmin,80px);height:min(13vmin,80px);border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 6px 0 var(--edge);font-size:min(7vmin,40px);opacity:.55}
.advstop.done .advstone{background:var(--green);color:#fff;opacity:1;font-family:var(--display);font-weight:600}
.advstop.now .advstone{opacity:1;background:var(--sel-bg);box-shadow:0 0 0 5px var(--yellow),0 6px 0 var(--edge);animation:pulse 1.4s infinite}
.advlabel{font-family:var(--display);font-size:clamp(14px,2.8vmin,20px);color:var(--muted)}
.advstop.now .advlabel{color:var(--ink)}
.advnote{font-size:clamp(17px,3.4vmin,24px)}

.hubhead h1{white-space:nowrap}
.htile .ico{height:clamp(42px,8.5vmin,66px);max-width:86%;display:flex;align-items:center;justify-content:center;gap:6%;font-size:clamp(30px,6.6vmin,52px);line-height:1}
.htile .ico svg{height:100%;width:auto;min-width:0;flex:0 1 auto}
.htile .ico.molei{width:auto;height:clamp(48px,9.5vmin,74px)}
.htile .ico.molei svg{width:auto;height:100%}

/* home: one grid of equal tiles under a fixed header */
.hub{flex:1;display:flex;flex-direction:column;min-height:0}
.hubhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px 10px;background:var(--board);box-shadow:0 8px 14px -10px rgba(0,0,0,.6);position:relative;z-index:2}
.hubhead h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,5vmin,46px);margin:0}

.hubscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 24px 32px}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(40vw,170px),1fr));gap:26px}

.htile.rest{opacity:.38;filter:saturate(.4)}
.htile .tick{position:absolute;top:8px;right:10px;font-family:var(--display);font-size:clamp(13px,2.4vmin,18px);color:#fff;background:rgba(0,0,0,.28);border-radius:999px;padding:2px 10px}
.htile .restnote{position:absolute;left:0;right:0;bottom:8px;font-size:clamp(12px,2.2vmin,15px);color:#fff}
.card .cardart{display:block;width:86%;height:86%}
.card .cardart svg{width:100%;height:100%;display:block}
.end>.note{margin:0}

/* learning recap on the end screen */
.end.withlearn{gap:16px;justify-content:flex-start;overflow:auto;padding-top:20px}
.endhead{display:flex;align-items:center;gap:18px;justify-content:center;text-align:left}
.end.withlearn .big{font-size:min(16vmin,96px)}
.end.withlearn h2{font-size:clamp(24px,5vmin,40px)}

.learn{background:var(--paper);border-radius:22px;padding:14px 22px 16px;max-width:min(92vw,640px);width:100%;text-align:left;box-shadow:0 6px 0 var(--edge)}

.card.dotcard span{white-space:pre-line;line-height:1.05;letter-spacing:.06em}

.racewrap .arena{flex:1}

.wlay{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}

.glay{display:flex;gap:4vmin;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.gcol{display:flex;flex-direction:column;gap:14px;align-items:center;min-width:min(100%,340px)}
.fwrap{position:relative}
.fwrap>.go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5}
.fwrap>.go:active{transform:translate(-50%,calc(-50% + 6px))}
@media (orientation:landscape){
  .sgrid.c4{grid-template-columns:repeat(var(--lc),auto)}
  .c4 .stile{width:min(18vmin,136px,calc((100vw - 60px)/var(--lc) - 12px));height:min(18vmin,136px,calc((100vw - 60px)/var(--lc) - 12px))}
}
@media (max-height:460px){
  .rbtn{width:40px;height:40px}.rbtn svg{width:20px;height:20px}
  .bar{padding:4px 10px 0}.dots{display:none}
  .prompt{font-size:18px}
  .stage{padding-top:4px;padding-bottom:8px;gap:8px}
  .gl .ltile{width:min(13vmin,64px);height:min(13vmin,64px);font-size:min(9vmin,40px)}
}

.edgeback{position:fixed;left:8px;top:40%;width:56px;height:56px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:60;opacity:0;transform:translateX(-70px);pointer-events:none}
.edgeback svg{width:28px;height:28px}
.edgeback.ready{background:var(--blue);color:#fff}

/* guess the word: typing goes straight into the grid */
.wwrap{position:relative;flex:none}
.wboard{gap:6px}
.wboard .wrow{gap:6px}
.wboard .wcell{width:var(--c);height:var(--c);font-size:calc(var(--c)*.6);border-radius:calc(var(--c)*.18)}
.wcell.now{border-color:var(--line)}
.wcell.typed{border-color:var(--blue)}
.wform{position:absolute;inset:0;margin:0}
.ghost{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;cursor:pointer;-webkit-user-select:text;user-select:text}
.stage.tight{gap:10px;padding-top:6px}
@media (max-height:760px){.rbtn{width:48px;height:48px}.rbtn svg{width:24px;height:24px}.bar{padding:8px 12px 2px}.prompt{font-size:clamp(18px,4.4vmin,30px)}}

.warm{position:fixed;inset:0;pointer-events:none;background:#ff9a3c;mix-blend-mode:multiply;opacity:.12;z-index:50}
.stage.top{justify-content:flex-start}
.rbtn.talking{animation:pulse .8s infinite;background:var(--sel-bg)}
.prompt.flash{animation:pop .5s;color:var(--yellow)}
.typein{width:min(62vmin,380px);font-family:var(--body);font-weight:700;font-size:min(8vmin,48px);text-align:center;letter-spacing:.12em;padding:8px 14px;border-radius:16px;border:4px solid var(--line);background:var(--paper);color:var(--ink);-webkit-user-select:text;user-select:text;outline:none}
.typein:focus{border-color:var(--blue)}
.typein::placeholder{color:var(--muted);letter-spacing:0;font-weight:400;font-size:.5em}
.entryrow{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.entryrow .go{padding:12px 26px}
.abc{display:grid;grid-template-columns:repeat(13,auto);gap:5px;justify-content:center}
.abc span{width:min(6.4vmin,40px);height:min(6.4vmin,40px);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:min(4.2vmin,24px);background:var(--paper);color:var(--muted)}
.abc span.g{background:var(--green);color:#fff}
.abc span.y{background:var(--yellow);color:#1f2a44}
.abc span.n{background:transparent;color:var(--grey);text-decoration:line-through}
.pstat{flex-basis:100%;margin:0;color:var(--muted)}
.tile .ico.molei{width:1.7em;height:1.7em;display:block}
.tile .ico.molei svg{width:100%;height:100%}
.tile .ico.molei .xeyes{display:none}
/* light up */
.pads{display:grid;grid-template-columns:repeat(2,auto);gap:min(4vmin,26px)}
.pad{width:min(32vmin,220px);height:min(32vmin,220px);border:0;cursor:pointer;opacity:.5;box-shadow:0 8px 0 rgba(0,0,0,.35);transition:opacity .08s,transform .08s,filter .08s;padding:0;touch-action:none}
.pad:nth-child(1){border-radius:100% 22px 22px 22px}
.pad:nth-child(2){border-radius:22px 100% 22px 22px}
.pad:nth-child(3){border-radius:22px 22px 22px 100%}
.pad:nth-child(4){border-radius:22px 22px 100% 22px}
.pad.lit{opacity:1;filter:brightness(1.3) saturate(1.2);transform:scale(1.05)}
/* brick bash */
.arena{position:relative;flex:1;width:100%;max-width:1000px;min-height:240px;border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:0 8px 0 var(--edge);touch-action:none}
.arena canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
/* mole pop */
.mhud{display:flex;gap:18px;align-items:center;justify-content:center;width:min(92vmin,640px)}
.msc{font-family:var(--display);font-weight:600;font-size:clamp(28px,6vmin,48px);min-width:2em;text-align:center}
.mbest{color:var(--muted);font-size:clamp(15px,3vmin,22px);white-space:nowrap}
.tbar{flex:1;height:18px;border-radius:9px;background:var(--cell);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left center;transform:scaleX(var(--t,1));transition:transform .1s linear}
.field{display:grid;grid-template-columns:repeat(3,auto);gap:min(2.5vmin,18px);padding:min(3vmin,20px);border-radius:28px;background:var(--grass);box-shadow:0 8px 0 var(--edge)}
.hole{--h:min(24vmin,170px,calc((100vh - 330px)/3));position:relative;width:var(--h);height:var(--h);cursor:pointer;touch-action:none}
.hole .pit{position:absolute;left:6%;right:6%;bottom:10%;height:24%;border-radius:50%;background:#1d130d}
.hole .win2{position:absolute;left:14%;right:14%;top:0;bottom:22%;overflow:hidden}
.hole .crit{position:absolute;left:0;right:0;bottom:0;height:100%;transform:translateY(105%);transition:transform .12s ease-out}
.hole .crit svg{width:100%;height:100%;display:block}
.hole.up .crit{transform:translateY(6%)}
.hole.hit .crit{transform:translateY(32%) scaleY(.85);transition:transform .08s}
.hole .crit .xeyes{display:none}
.hole.hit:not(.hog) .crit .eyes{display:none}
.hole.hit:not(.hog) .crit .xeyes{display:inline}
.hole .lip{position:absolute;left:6%;right:6%;bottom:10%;height:12%;border-radius:0 0 50% 50%/0 0 100% 100%;background:#7a4a2a}
.hole .pow{position:absolute;left:50%;top:0;font-family:var(--display);font-weight:600;font-size:min(6vmin,38px);color:var(--yellow);pointer-events:none;opacity:0;transform:translateX(-50%)}
.hole.hog .pow{color:var(--red)}
.hole.hit .pow{animation:powup .7s ease-out}
@keyframes powup{0%{opacity:0;transform:translate(-50%,10px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}

@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="warm" class="warm" aria-hidden="true"></div>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $app=document.getElementById('app');
function h(tag,props,kids){
  var e=document.createElement(tag),k;
  if(props){for(k in props){
    if(k==='class')e.className=props[k];
    else if(k==='html')e.innerHTML=props[k];
    else if(k==='text')e.textContent=props[k];
    else if(k==='style')e.style.cssText=props[k];
    else e.setAttribute(k,props[k]);
  }}
  (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function rnd(n){return Math.floor(Math.random()*n);}
function between(a,b){return a+rnd(b-a+1);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- settings (kept on this device only) ---------- */
var KEY='littlesparks.v2';
var S={diff:3,adapt:true,off:{},streak:{},voice:true,sfx:true,limit:20,day:'',used:0,bonus:0,theme:'dark',warm:true};
(function(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r){for(var k in r)S[k]=r[k];}}catch(e){}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){return new Date().toDateString();}
function rollDay(){if(S.day!==today()){S.day=today();S.used=0;S.bonus=0;save();}}
function limitReached(){rollDay();return S.limit>0&&S.used>=S.limit*60+S.bonus;}
/* one global difficulty (1 to 5); each game may drift one step either side of it */
function levelOf(id){return clamp(S.diff,1,5);}
var DIFFNAME=['','Starter','Easy','Steady','Tricky','Expert'];

var screen='home';
/* ---------- touch health: one press, one action ---------- */
var lastStamp=0;
function stamp(){lastStamp=Date.now();}
(function(){
  function guard(e){
    var b=e.target&&e.target.closest&&e.target.closest('button,.hole,.spotpic');
    if(!b)return;
    var now=Date.now();
    /* a tap that started on the old screen must not land on the new one */
    if(now-lastStamp<450&&!b.classList.contains('hold')){e.stopImmediatePropagation();e.preventDefault();return;}
    /* the same button tapped twice in quick succession counts once (letter keys, pads and moles are exempt) */
    if(e.type==='click'&&!b.matches('.wkey,.pad,.catarrow,.paint,.steer,.key')){
      if(b._lastTap&&now-b._lastTap<450){e.stopImmediatePropagation();e.preventDefault();return;}
      b._lastTap=now;
    }
  }
  document.addEventListener('click',guard,true);
  document.addEventListener('pointerdown',guard,true);
  /* show the press straight away, even for very quick taps */
  document.addEventListener('pointerdown',function(e){
    var b=e.target&&e.target.closest&&e.target.closest('.block,.wkey,.xbar');
    if(!b||b.disabled)return;
    b.classList.add('pressed');
    var t0=Date.now();
    function up(){setTimeout(function(){b.classList.remove('pressed');},Math.max(0,130-(Date.now()-t0)));document.removeEventListener('pointerup',up,true);document.removeEventListener('pointercancel',up,true);}
    document.addEventListener('pointerup',up,true);document.addEventListener('pointercancel',up,true);
  },true);
})();
setInterval(function(){
  if(screen!=='game'||document.hidden)return;
  rollDay();S.used++;if(S.used%10===0)save();
},1000);

/* ---------- sound and voice ---------- */
var ac=null;
function tone(f,t0,d,vol){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+0.05);
}
function audio(){
  if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();}
  if(ac.state==='suspended')ac.resume();
  return true;
}
/* xylophone notes for the music game: always sound, even with effects off */
var NOTES=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
function ping(i,long){
  try{
    if(!audio())return;
    var t=ac.currentTime,d=long?1.1:.7;
    [[1,.3,d],[4,.05,.18]].forEach(function(p){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=NOTES[i]*p[0];
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(p[1],t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+p[2]+0.05);
    });
  }catch(e){}
}
function sfx(k){
  if(!S.sfx)return;
  try{
    if(!audio())return;
    var t=ac.currentTime;
    if(k==='good'){tone(660,t,.18);tone(880,t+.12,.26);}
    else if(k==='tick'){tone(700,t,.1);}
    else if(k==='soft'){tone(220,t,.16,.07);}
    else if(k==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,t+i*.13,.3);});}
  }catch(e){}
}
/* ---------- voice: uses the device's own speech engine ---------- */
var lastSpoken='',VOICE=null,voiceOK=null,keepU=[],earEl=null;
/* inside the Android app, questions are read by the tablet's own voice */
var NATIVE=(window.LittleSparksTTS&&typeof window.LittleSparksTTS.speak==='function')?window.LittleSparksTTS:null,earT=null;
var HAS_TTS=!!(NATIVE||(window.speechSynthesis&&window.SpeechSynthesisUtterance));
function voiceList(){try{return window.speechSynthesis.getVoices()||[];}catch(e){return[];}}
/* rank voices so the most natural-sounding English one is used, unless a grown-up picked one */
function voiceScore(v){
  var n=(v.name||'').toLowerCase(),l=(v.lang||'').replace('_','-').toLowerCase(),sc=0;
  if(l.indexOf('en')!==0)return -1;
  if(l.indexOf('en-gb')===0)sc+=30;
  if(/natural|neural|online|enhanced|premium|wavenet|studio|siri/.test(n))sc+=50;
  if(/google/.test(n))sc+=20;
  if(/compact|espeak|robot|novelty|bad news|bells|zarvox|whisper/.test(n))sc-=60;
  if(v.localService)sc+=5;
  return sc;
}
function pickVoice(){
  var vs=voiceList();if(!vs.length)return;
  if(S.voiceName){for(var i=0;i<vs.length;i++)if(vs[i].name===S.voiceName){VOICE=vs[i];return;}}
  var best=null,bs=-1;vs.forEach(function(v){var sc=voiceScore(v);if(sc>bs){bs=sc;best=v;}});
  VOICE=best||vs[0];
}
function englishVoices(){
  if(NATIVE&&NATIVE.voices){try{return JSON.parse(NATIVE.voices());}catch(e){return[];}}
  return voiceList().filter(function(v){return voiceScore(v)>=0;}).sort(function(a,b){return voiceScore(b)-voiceScore(a);})
    .map(function(v){return{name:v.name,label:v.name.replace(/^(Microsoft|Google|Apple)\s+/,'').replace(/\s*\(.*?\)\s*/g,' ').replace(/ - English.*$/,'').trim().slice(0,26)};});
}
function applyVoice(){
  if(NATIVE){try{if(NATIVE.setVoice)NATIVE.setVoice(S.voiceName||'');if(NATIVE.setRate)NATIVE.setRate(S.rate||.95);}catch(e){}}
  else{VOICE=null;pickVoice();}
}
if(HAS_TTS&&!NATIVE){
  pickVoice();
  try{window.speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){try{window.speechSynthesis.onvoiceschanged=pickVoice;}catch(x){}}
}
/* some browsers only allow speech after the first tap: say nothing once, silently, on that tap */
document.addEventListener('pointerdown',function unlock(){
  document.removeEventListener('pointerdown',unlock,true);
  if(!HAS_TTS||NATIVE)return;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;window.speechSynthesis.speak(u);}catch(e){}
},true);
function earTalk(on){if(earEl)earEl.classList.toggle('talking',!!on);}
function hush(){try{if(NATIVE)NATIVE.stop();else if(HAS_TTS)window.speechSynthesis.cancel();}catch(e){}earTalk(false);}
function noVoice(){
  if(!promptEl)return;
  promptEl.classList.remove('flash');void promptEl.offsetWidth;promptEl.classList.add('flash');
}
function say(text,tapped){
  if(!S.voice&&!tapped)return;
  if(!HAS_TTS){if(tapped)noVoice();return;}
  if(NATIVE){
    try{
      if(!NATIVE.ready()){voiceOK=false;if(tapped)noVoice();return;}
      NATIVE.speak(text);voiceOK=true;earTalk(true);
      clearTimeout(earT);earT=setTimeout(function(){earTalk(false);},700+text.length*75);
    }catch(e){if(tapped)noVoice();}
    return;
  }
  var ss=window.speechSynthesis,started=false;
  try{
    if(!VOICE)pickVoice();
    var u=new SpeechSynthesisUtterance(text);
    if(VOICE){u.voice=VOICE;u.lang=VOICE.lang;}else u.lang='en-GB';
    u.rate=S.rate||.95;u.pitch=1;u.volume=1;
    u.onstart=function(){started=true;voiceOK=true;earTalk(true);};
    u.onend=function(){earTalk(false);};
    u.onerror=function(){earTalk(false);};
    keepU.push(u);if(keepU.length>6)keepU.shift();
    var go=function(){try{ss.speak(u);if(ss.paused)ss.resume();}catch(e){}};
    if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,120);}else go();
    if(tapped)setTimeout(function(){if(!started){voiceOK=false;noVoice();}},3000);
  }catch(e){if(tapped)noVoice();}
}

/* ---------- shapes ---------- */
var COL={red:'#ef5b4c',yellow:'#f6b93b',green:'#3fae6a',blue:'#3d8fe0',purple:'#8a63d2',pink:'#ee6fa0'};
var COLS=Object.keys(COL);
function poly(n,r,rot){var p=[];for(var i=0;i<n;i++){var a=rot+i*2*Math.PI/n;p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function starPts(){var p=[];for(var i=0;i<10;i++){var r=i%2?19:45,a=-Math.PI/2+i*Math.PI/5;p.push((50+r*Math.cos(a)).toFixed(1)+','+(52+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
var LITE=' fill="#fff" opacity=".38" stroke="none"',DARK=' fill="#000" opacity=".2" stroke="none"';
var SHAPE={
  circle:'<circle cx="50" cy="50" r="42"/>',
  square:'<rect x="11" y="11" width="78" height="78" rx="5"/>',
  triangle:'<polygon points="50,9 93,87 7,87"/>',
  rectangle:'<rect x="5" y="27" width="90" height="46" rx="5"/>',
  oval:'<ellipse cx="50" cy="50" rx="45" ry="28"/>',
  diamond:'<polygon points="50,5 84,50 50,95 16,50"/>',
  heart:'<path d="M50 88 C12 60 6 32 26 20 C38 13 48 20 50 31 C52 20 62 13 74 20 C94 32 88 60 50 88Z"/>',
  star:'<polygon points="'+starPts()+'"/>',
  pentagon:'<polygon points="'+poly(5,44,-Math.PI/2)+'"/>',
  hexagon:'<polygon points="'+poly(6,44,0)+'"/>',
  octagon:'<polygon points="'+poly(8,44,Math.PI/8)+'"/>',
  semicircle:'<path d="M8 68 A42 42 0 0 1 92 68 Z"/>',
  crescent:'<path d="M62 9.75 A42 42 0 1 0 62 90.25 A46 46 0 0 1 62 9.75Z"/>',
  cross:'<polygon points="36,8 64,8 64,36 92,36 92,64 64,64 64,92 36,92 36,64 8,64 8,36 36,36"/>',
  arrow:'<polygon points="8,38 56,38 56,16 94,50 56,84 56,62 8,62"/>',
  trapezium:'<polygon points="28,22 72,22 94,80 6,80"/>',
  parallelogram:'<polygon points="30,24 94,24 70,78 6,78"/>',
  kite:'<polygon points="50,5 80,38 50,95 20,38"/>',
  sphere:'<circle cx="50" cy="50" r="42"/><path d="M50 92 A42 42 0 0 0 92 50 A52 52 0 0 1 50 92Z"'+DARK+'/><ellipse cx="35" cy="33" rx="14" ry="8" transform="rotate(-35 35 33)"'+LITE+'/>',
  cube:'<rect x="12" y="34" width="56" height="56"/><polygon points="12,34 32,12 88,12 68,34"/><polygon points="12,34 32,12 88,12 68,34"'+LITE+'/><polygon points="68,34 88,12 88,68 68,90"/><polygon points="68,34 88,12 88,68 68,90"'+DARK+'/>',
  cuboid:'<rect x="5" y="44" width="68" height="36"/><polygon points="5,44 23,26 91,26 73,44"/><polygon points="5,44 23,26 91,26 73,44"'+LITE+'/><polygon points="73,44 91,26 91,62 73,80"/><polygon points="73,44 91,26 91,62 73,80"'+DARK+'/>',
  cylinder:'<path d="M22 24 V78 A28 11 0 0 0 78 78 V24Z"/><path d="M58 34 V88 A28 11 0 0 0 78 78 V24Z"'+DARK+'/><ellipse cx="50" cy="24" rx="28" ry="11"/><ellipse cx="50" cy="24" rx="28" ry="11"'+LITE+'/>',
  cone:'<path d="M50 8 L22 80 A28 10 0 0 0 78 80Z"/><path d="M50 8 L58 89 A28 10 0 0 0 78 80Z"'+DARK+'/>',
  pyramid:'<polygon points="50,10 10,82 60,92"/><polygon points="50,10 60,92 92,70"/><polygon points="50,10 60,92 92,70"'+DARK+'/>'
};
function shapeEl(name,colour,rot){
  return h('span',{class:'shape',html:'<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="'+(COL[colour]||colour)+'" stroke="rgba(31,42,68,.28)" stroke-width="2" stroke-linejoin="round"'+(rot?' transform="rotate('+rot+' 50 50)"':'')+'>'+SHAPE[name]+'</g></svg>'});
}

/* ---------- game shell ---------- */
var G=null,stageEl=null,promptEl=null,dotsEl=null;
var ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>',
  ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>'
};
function setPrompt(text,spoken){promptEl.textContent=text;lastSpoken=spoken||text;say(lastSpoken);}
function drawDots(){
  dotsEl.innerHTML='';

      if(locked||G!==g||b.disabled)return;

        locked=true;b.classList.remove('hint');b.classList.add('right');sfx('good');
        if(o.after)o.after();if(o.fact)addFact(o.fact);

function spellQ(stage,w,extra,done){

  stage.appendChild(h('div',{class:'slots'+five},slotEls));
  var tiles=letters.concat(sample(ABC.filter(function(x){return letters.indexOf(x)<0;}),extra));
  do{tiles=shuffle(tiles);}while(tiles.slice(0,letters.length).join('')===word);
  var row=h('div',{class:'choices'+five});
  function mkTile(ch){
    var b=h('button',{class:'block ltile',type:'button',text:ch});
    b.addEventListener('click',function(){
      if(G!==g||b.disabled||pos>=letters.length||b.classList.contains('wrongflash'))return;
      if(ch===letters[pos]){
        slotEls[pos].textContent=ch;slotEls[pos].classList.add('filled');
        b.disabled=true;b.classList.add('used');pos++;
        if(pos===letters.length){sfx('good');addFact(w[1]+' '+word);done(example(word,stage,row));}else sfx('tick');
      }else{
        g.mistakes++;sfx('soft');b.classList.add('wrongflash');
        setTimeout(function(){
          if(G!==g)return;
          if(letters.indexOf(ch)<0){
            var have=Array.prototype.map.call(row.children,function(x){return x.textContent;});
            var pool=ABC.filter(function(x){return letters.indexOf(x)<0&&have.indexOf(x)<0;});
            if(pool.length){var nb=mkTile(pick(pool));nb.classList.add('newin');row.replaceChild(nb,b);return;}
          }
          b.classList.remove('wrongflash');

      }
    });
    return b;
  }
  tiles.forEach(function(ch){row.appendChild(mkTile(ch));});
  stage.appendChild(row);
}

/* show the sentence with the word in bold, read it aloud, and return how long to wait before moving on */
function example(word,parent,before){
  var s=SENT[word];
  if(!s)return 1700;
  var p=h('p',{class:'sentence'});
  s.split(/(\s+)/).forEach(function(tok){
    var bare=tok.toLowerCase().replace(/[^a-z]/g,'');
    p.appendChild(bare===word?h('b',{text:tok}):document.createTextNode(tok));
  });
  if(before&&before.parentNode===parent)parent.insertBefore(p,before);else parent.appendChild(p);
  say(word+'. '+s);
  return Math.min(6500,1900+s.length*70);
}

var PADS=[{c:'green',f:392},{c:'red',f:523.25},{c:'yellow',f:659.25},{c:'blue',f:783.99}];
function padTone(i,dur){
  try{
    if(!audio())return;
    var t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
    o.type='triangle';o.frequency.value=PADS[i].f;
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(.34,t+.015);
    gn.gain.setValueAtTime(.34,t+dur*.7);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
function buzz(){
  try{
    if(!audio())return;
    var t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
    o.type='sawtooth';o.frequency.value=110;
    gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(.08,t+.02);gn.gain.exponentialRampToValueAtTime(0.0001,t+.35);
    o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+.4);
  }catch(e){}
}

  rounds:function(level){return[0,4,5,5,6,7][level];},
  play:function(level,stage,done){
    var g=G,start=[0,1,1,2,3,4][level],ms=[0,720,640,560,480,420][level],i;
    function add(){var n,k=0;do{n=rnd(4);}while(g.seq.length>=2&&n===g.seq[g.seq.length-1]&&n===g.seq[g.seq.length-2]&&++k<9);g.seq.push(n);}

  }

function spotScene(){

  sample(SKYSLOTS.map(function(_,i){return i;}),2).forEach(function(i){sc.items['s'+i]=pick(SKYTHINGS);});
  sample(GROUNDSLOTS.map(function(_,i){return i;}),5).forEach(function(i){sc.items['g'+i]=pick(GROUNDTHINGS);});

}

  o+='<rect x="23" y="46" width="11" height="9" fill="#e9f6ff" stroke="#fff" stroke-width="1"/>';

var spotGame={id:'spot',name:'Spot the difference',c:'cyan',
  rounds:function(){return 1;},
  play:function(level,stage,done){
    var g=G,N=[0,3,3,4,5,6][level],kinds=level===1?['gone','extra']:(level===2?['gone','extra','swap']:['gone','extra','swap','colour','colour']);
    var A=spotScene(),B=JSON.parse(JSON.stringify(A)),diffs=[],used={},tries=0;
    while(diffs.length<N&&tries++<200){
      var kind=pick(kinds),d=null;

        if(!free.length)continue;var k3=pick(free),pool2=k3.charAt(0)==='s'?SKYTHINGS:GROUNDTHINGS,it3=pick(pool2);

  }

/* ---------- puzzles: a fresh layout every time, never the same one twice ---------- */
function dayNum(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}
function seeded(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;

/* A. Guess the word */
function scoreGuess(guess,word){
  var res=[],rem=word.split(''),i,k;
  for(i=0;i<word.length;i++){if(guess.charAt(i)===word.charAt(i)){res[i]='g';rem[i]=null;}else res[i]='n';}
  for(i=0;i<word.length;i++){if(res[i]!=='g'){k=rem.indexOf(guess.charAt(i));if(k>=0){res[i]='y';rem[k]=null;}}}
  return res;
}

var SETS=Object.keys(GARDEN).sort();
var gardenPuz={id:'garden',name:'Word garden',
  open:function(stage,p){
    var g=G,st=p.st;
    if(!st){
      var key=SETS[perm(SETS.length,1234)[p.n%SETS.length]],cm=GARDEN[key].split('|')[0].split(' ');
      st=p.st={set:key,goal:Math.min([0,3,3,4,5,6][S.diff],cm.length-1),found:[],done:false};
    }
    var set=st.set,mid=set.charAt(0),parts=GARDEN[set].split('|'),common=parts[0].split(' '),words=common.concat(parts[1]?parts[1].split(' '):[]);
    var GOAL=st.goal,cur='';
    stage.classList.add('top');
    var found=h('div',{class:'found'}),msg=note(),letters=h('div',{class:'gl'});
    var inp=typeBox({max:8,allow:set,label:'Type a word',onChange:function(v){cur=v;msg.textContent='';},onEnter:check});
    function paint(){
      found.innerHTML='';
      st.found.forEach(function(x){found.appendChild(h('span',{text:x}));});
      for(var i=st.found.length;i<GOAL;i++)found.appendChild(h('span',{class:'todo',text:'.'}));
    }
    function check(){
      if(G!==g||st.done)return;
      var bad='';
      if(cur.length<3)bad='Make it three letters or more.';
      else if(cur.indexOf(mid)<0)bad='Use the yellow letter too.';
      else if(st.found.indexOf(cur)>=0)bad='You have that one already.';
      else if(words.indexOf(cur)<0)bad='That is not a word I know.';
      if(bad){msg.textContent=bad;sfx('soft');inp.setValue('');return;}
      st.found.push(cur);msg.textContent=SENT[cur]||'';say(SENT[cur]?cur+'. '+SENT[cur]:cur);inp.setValue('');
      if(st.found.length>=GOAL)st.done=true;
      save();paint();
      if(st.done)setTimeout(function(){if(G===g)finish();},1100);else sfx('good');
    }
    var acts=actKeys(function(){if(G!==g||st.done)return;inp.setValue(cur.slice(0,-1));},check);
    function finish(){
      letters.style.display=acts.style.display=inp.style.display='none';inp.blur();
      var more=common.filter(function(x){return st.found.indexOf(x)<0;}).slice(0,6);
      msg.textContent=more.length?'Other words you could make: '+more.join(', ')+'.':'';
      setPrompt('Brilliant! You made '+GOAL+' words.');sfx('win');
      puzzleDone(gardenPuz,stage);
    }
    var order=sshuffle(set.slice(1).split(''),seeded(p.n+7));
    [order[0],order[1],mid,order[2],order[3]].forEach(function(l){
      var b=h('button',{class:'block ltile'+(l===mid?' mid':''),type:'button',text:l});
      b.addEventListener('click',function(){
        if(G!==g||st.done||cur.length>=8)return;
        inp.setValue(cur+l);sfx('tick');
      });
      letters.appendChild(b);
    });
    stage.appendChild(h('div',{class:'glay'},[h('div',{class:'gcol'},[found,inp,msg]),h('div',{class:'gcol'},[letters,acts])]));
    paint();
    setPrompt('Make '+GOAL+' words. Always use '+mid+'.');
  }
};

var ADV_AREAS=[
  {label:'Reading',icon:'📖'},{label:'Numbers',icon:'🔢'},{label:'Thinking',icon:'🧩'},

/* the mix changes day to day, so each area gets different practice across the week */
function advPlan(){
  var d=dayNum();
  return[
    {area:0,def:lettersGame,n:3},
    {area:1,def:countGame,n:3},
    {area:2,def:[shapesGame,nextGame,spotGame][d%3],n:d%3===2?1:3},
    {area:3,def:[pairsGame,lightGame,trolleyGame][d%3],n:[1,3,2][d%3]},
    {area:4,def:copyGame,n:1}
  ];
}
function advState(){
  var d=dayNum();
  if(!S.adv||S.adv.day!==d)S.adv={day:d,stage:0,notes:[],done:false};
  return S.adv;
}
function startAdventure(){
  openCat=null;
  if(limitReached())return allDone();
  if(!canPlay('adventure')){home();return nudge();}
  notePlay('adventure');
  var A=advState();
  if(A.done){A.stage=0;A.notes=[];A.done=false;}
  save();advMap();
}
/* the path between stops */
function advMap(){
  if(limitReached())return allDone();
  screen='game';G={def:{id:'adventure'},advMap:true,i:0,total:0,mistakes:0};
  buildShell();
  var A=advState(),plan=advPlan(),k=A.stage,area=ADV_AREAS[plan[k].area];
  var path=h('div',{class:'advpath'});
  plan.forEach(function(p,i){
    var a=ADV_AREAS[p.area],cls='advstop'+(i<k?' done':(i===k?' now':''));
    path.appendChild(h('div',{class:cls},[
      h('div',{class:'advstone'},[h('span',{text:i<k?'✓':a.icon})]),
      h('span',{class:'advlabel',text:a.label})
    ]));
  });
  var go=h('button',{class:'block go',type:'button',text:k===0?'Let’s go!':'Go to stop '+(k+1)});
  go.addEventListener('click',function(){sfx('tick');startStage(plan[k]);});
  stageEl.appendChild(path);
  stageEl.appendChild(h('p',{class:'note advnote',text:'Stop '+(k+1)+' of '+plan.length+': '+area.icon+' '+area.label+' with '+plan[k].def.name}));
  stageEl.appendChild(go);
  setPrompt(k===0?'Today’s adventure has 5 stops. Let’s go!':'Great! Next stop: '+area.label+'!');
}
function startStage(st){
  if(limitReached())return allDone();
  screen='game';
  G={def:st.def,level:levelOf(st.def.id),i:0,mistakes:0,facts:[],adv:st};
  G.total=st.n;
  buildShell();nextQ();
}
/* a stop is finished: keep one or two things she learned, then back to the path */
function advStageDone(g){
  adapt(g);
  var A=advState(),plan=advPlan(),les=LESSONS[g.def.id]?LESSONS[g.def.id](g):null;
  var lines=les?les.lines.slice(0,1):(g.facts||[]).slice(-1);
  A.notes.push({area:g.adv.area,lines:lines});
  A.stage++;save();
  if(A.stage>=plan.length){A.done=true;save();return advFinish(A);}
  sfx('good');advMap();
}
function advFinish(A){
  screen='end';G=null;
  $app.innerHTML='';stamp();
  var card=h('div',{class:'learn'},[h('h3',{text:'What you learned today'})]),ul=h('ul'),spoken=[];
  A.notes.forEach(function(n){
    var a=ADV_AREAS[n.area];
    n.lines.forEach(function(t){ul.appendChild(h('li',{text:a.icon+' '+a.label+': '+t}));});
    if(n.lines[0])spoken.push(n.lines[0]);
  });
  card.appendChild(ul);
  var said=spoken.join(' ').replace(/ − /g,' take away ').replace(/ \+ /g,' plus ').replace(/ = /g,' is ');
  var hear=h('button',{class:'block go alt hearall',type:'button',text:'Read it to me'});
  hear.addEventListener('click',function(){say(said,true);});
  card.appendChild(hear);
  sfx('win');
  say('You finished today\u2019s adventure!');
  $app.appendChild(h('div',{class:'end withlearn'},[
    h('div',{class:'endhead'},[h('div',{class:'big',text:'🏅'}),h('div',{},[h('h2',{text:'Adventure complete!'}),h('p',{text:'Reading, numbers, thinking, memory and making. A new adventure is ready tomorrow.'})])]),
    card,
    h('div',{class:'endbtns'},[homeButton()])
  ]));
}

function holdButton(label,onOpen){
  var b=h('button',{class:'hold',type:'button'},[h('i'),h('b',{text:label})]),t=null;
  function stop(){clearTimeout(t);t=null;b.classList.remove('going');}
  function start(e){if(e)e.preventDefault();if(t)return;b.classList.add('going');t=setTimeout(function(){stop();onOpen();},3000);}
  b.addEventListener('pointerdown',start);
  b.addEventListener('pointerup',stop);b.addEventListener('pointerleave',stop);b.addEventListener('pointercancel',stop);
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
  b.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.repeat)start(e);});
  b.addEventListener('keyup',stop);
  return b;
}

var HOMECATS=[
  {id:'words',label:'Words',icon:'📖',c:'blue',items:[[lettersGame],[wordPuz,1],[gardenPuz,1]]},
  {id:'numbers',label:'Numbers & shapes',icon:'🔢',c:'red',items:[[countGame],[shapesGame],[copyGame]]},
  {id:'think',label:'Thinking & memory',icon:'🧠',c:'green',items:[[nextGame],[sortPuz,1],[pairsGame],[lightGame],[trolleyGame],[spotGame]]},
  {id:'quick',label:'Quick fingers',icon:'⚡',c:'purple',items:[[moleGame],[balloonGame],[brickGame],[raceGame],[capyGame]]}
];
var openCat=null;
function gameTile(e){
  var d=e[0],isP=!!e[1],n=isP?solvedToday(d.id):0,ok=canPlay(d.id),left=2-playsToday(d.id);
  var b=h('button',{class:'block tile htile'+(ok?'':' rest'),type:'button',style:'--c:var(--'+d.c+');--cd:var(--'+d.c+'-d)'},[
    tileIcon(d.id),h('span',{class:'nm',text:d.name}),
    n?h('span',{class:'tick',text:'✓ '+n}):null,
    ok?(S.rotate!==false&&left===1?h('span',{class:'gobadge',text:'1 more go'}):null):h('span',{class:'restnote',text:'Played twice today'})]);
  b.addEventListener('click',function(){
    if(!canPlay(d.id))return nudge(b);
    sfx('tick');if(isP)startPuzzle(d);else startGame(d);
  });
  return b;
}
function bestCols(n,W,H,gap){
  var best=1,bs=0;
  for(var c=1;c<=n;c++){var r=Math.ceil(n/c),w=(W-gap*(c-1))/c,hh=(H-gap*(r-1))/r,sz=Math.min(w,hh*1.25);if(sz>bs+1){bs=sz;best=c;}}
  return best;
}
function openCategory(cat){
  hush();screen='cat';openCat=cat;G=null;enterPlay();
  $app.innerHTML='';stamp();
  var back=h('button',{class:'block rbtn',type:'button','aria-label':'Back to the games',html:ICON.home});
  back.addEventListener('click',function(){sfx('tick');home();});
  var grid=h('div',{class:'catgrid'});
  var wrap=h('div',{class:'catscreen',style:'--c:var(--'+cat.c+');--cd:var(--'+cat.c+'-d)'},[
    h('div',{class:'cathead'},[back,h('h2',{class:'cattitle'},[h('span',{class:'caticon',text:cat.icon}),h('span',{text:cat.label})]),h('span',{class:'iconspacer'})]),
    grid]);
  $app.appendChild(wrap);
  var n=cat.items.length,gap=14,W=grid.clientWidth,H=grid.clientHeight,cols=bestCols(n,W,H,gap),rows=Math.ceil(n/cols);
  grid.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
  grid.style.gridTemplateRows='repeat('+rows+',minmax(0,1fr))';
  var th=Math.min((H-gap*(rows-1))/rows,((W-gap*(cols-1))/cols)*0.8);
  grid.style.setProperty('--th',Math.floor(th)+'px');
  cat.items.forEach(function(e){grid.appendChild(gameTile(e));});
}
function home(fromPop){
  var from=screen;
  if(G&&G.t0&&Date.now()-G.t0>=45000)countPlay(G);
  /* back from a game goes to the category it came from */
  if(openCat&&from==='game'){
    var c=openCat;G=null;
    if(fromPop===true)inPlay=false;
    openCategory(c);return;
  }
  openCat=null;
  if(fromPop!==true&&inPlay){inPlay=false;try{history.back();}catch(e){}}
  screen='home';G=null;hush();
  $app.innerHTML='';stamp();
  var A=S.adv&&S.adv.day===dayNum()?S.adv:null;
  var sub=A&&A.done?'✓ Done today. Well done!':(A&&A.stage?'Stop '+(A.stage+1)+' of 5: carry on':'5 stops: reading, numbers, thinking, memory, making');
  var adv=h('button',{class:'block tile advtile'+(A&&A.done?' fin':''),type:'button'},[
    h('span',{class:'advicons','aria-hidden':'true',text:'📖🔢🧩🧠🎨'}),
    h('span',{class:'advtxt'},[h('span',{class:'nm',text:'Today’s adventure'}),h('span',{class:'advsub',text:sub})])]);
  adv.addEventListener('click',function(){sfx('tick');startAdventure();});
  var doors=h('div',{class:'doors'});
  HOMECATS.forEach(function(cat){
    var free=cat.items.filter(function(e){return canPlay(e[0].id);}).length;
    var d=h('button',{class:'block tile door',type:'button',style:'--c:var(--'+cat.c+');--cd:var(--'+cat.c+'-d)'},[
      h('span',{class:'doorico','aria-hidden':'true',text:cat.icon}),
      h('span',{class:'nm',text:cat.label}),
      h('span',{class:'doorsub',text:cat.items.length+' games'})]);
    if(!free)d.classList.add('rest');
    d.addEventListener('click',function(){sfx('tick');openCategory(cat);});
    doors.appendChild(d);
  });
  var land=window.innerWidth>window.innerHeight*1.2;
  doors.classList.toggle('row4',land);
  $app.appendChild(h('div',{class:'hub'},[
    h('div',{class:'hubhead'},[h('h1',{html:'Little <span>Sparks</span>'}),diffSlider(),holdButton('Grown-ups (hold)',parent)]),
    h('div',{class:'hubbody'},[adv,doors])
  ]));
}
function adapt(g){
  var id=g.def.id;
  if(false){
    var off=S.off[id]||0;
    if(g.mistakes<=1){
      S.streak[id]=(S.streak[id]||0)+1;
      if(S.streak[id]>=2&&off<1){S.off[id]=off+1;S.streak[id]=0;}
    }else{
      S.streak[id]=0;
      if(g.mistakes>=Math.max(4,g.total)&&off>-1)S.off[id]=off-1;
    }
  }
}
function roundEnd(){
  var g=G;countPlay(g);
  if(g.def.id!=='moles')adapt(g);
  save();
  if(limitReached())return allDone();
  screen='end';G=null;
  $app.innerHTML='';stamp();
  var title=g.endTitle||'Well done!',card=learnCard(g);
  sfx('win');say(title);
  var again=null;
  if(canPlay(g.def.id)){again=h('button',{class:'block go alt',type:'button',text:'Play again'});again.addEventListener('click',function(){startGame(g.def);});}
  $app.appendChild(h('div',{class:'end'+(card?' withlearn':'')},[
    h('div',{class:'endhead'},[h('div',{class:'big',text:g.endIcon||'⭐'}),h('div',{},[h('h2',{text:title}),g.endNote?h('p',{text:g.endNote}):null])]),
    card?card.el:null,
    h('div',{class:'endbtns'},[homeButton(),again]),
    again?null:h('p',{class:'note',text:'You have played this twice today. Try a different game!'})
  ]));
}
function allDone(){
  screen='done';G=null;save();enterPlay();
  $app.innerHTML='';stamp();
  say('All done for today. Time to play something else.');
  $app.appendChild(h('div',{class:'end'},[
    h('div',{class:'big',text:'🌙'}),h('h2',{text:'All done for today'}),
    h('p',{text:'Time to play something else.'}),
    h('p',{class:'addlbl',text:'Grown-ups: press and hold to add more time'}),
    h('div',{class:'addtime'},[10,20,30].map(function(m){
      return holdButton('+'+m+' minutes',function(){
        rollDay();S.bonus+=m*60;save();sfx('good');
        say(m+' more minutes. Have fun!',true);home();
      });
    }))
  ]));
}
function segRow(label,opts,current,onPick){
  var seg=h('div',{class:'seg',role:'group','aria-label':label});
  opts.forEach(function(o){
    var b=h('button',{type:'button',class:'segb'+(o[0]===current?' on':''),text:o[1]});
    if(o[0]===current)b.setAttribute('aria-pressed','true');
    b.addEventListener('click',function(){onPick(o[0]);save();applyTheme();parent();});
    seg.appendChild(b);
  });
  return h('div',{class:'prow'},[h('span',{class:'plabel',text:label}),seg]);
}
function voiceStatus(){
  if(NATIVE){try{if(NATIVE.ready()){var vn=NATIVE.voiceName();return'Using the tablet\u2019s own voice'+(vn?' ('+vn+')':'')+'.';}}catch(e){}return'The tablet\u2019s voice is still starting. Tap Test voice in a moment.';}
  if(!HAS_TTS)return'This browser has no speech engine, so questions cannot be read aloud here.';
  var vs=voiceList();
  if(voiceOK===false)return'The last test did not start. Check the volume, then try again.';
  if(!vs.length)return'No voices found yet. Tap Test voice.';
  return vs.length+' voice'+(vs.length>1?'s':'')+' found'+(VOICE?'. Using '+VOICE.name+'.':'.');
}
function parent(){
  var keep=screen==='parent'&&$app.firstChild?$app.firstChild.scrollTop:0;
  screen='parent';G=null;rollDay();hush();enterPlay();
  $app.innerHTML='';stamp();
  var w=h('div',{class:'parent'});
  var back=h('button',{class:'block go',type:'button',text:'Back to the games'});
  back.addEventListener('click',home);
  w.appendChild(h('div',{class:'phead'},[h('h2',{text:'Grown-ups'}),back]));
  w.appendChild(h('h3',{text:'Play time'}));
  var mins=Math.floor(S.used/60);
  w.appendChild(h('p',{text:'Played today: '+mins+' min. Every game and puzzle can be played as often as she likes until the limit. Then the current round finishes and everything closes for the day.'}));
  w.appendChild(segRow('Daily limit',[[0,'Off'],[10,'10 min'],[15,'15 min'],[20,'20 min'],[30,'30 min'],[45,'45 min']],S.limit,function(v){S.limit=v;}));
  w.appendChild(segRow('Extra time today',[[S.bonus,(S.bonus/60)+' min added'],[S.bonus+600,'Add 10 min']],S.bonus,function(v){S.bonus=v;}));
  w.appendChild(segRow('Each game twice a day',[[true,'On'],[false,'Off']],S.rotate!==false,function(v){S.rotate=v;}));
  w.appendChild(h('h3',{text:'Screen'}));
  w.appendChild(segRow('Colours',[['dark','Dark'],['light','Light']],S.theme,function(v){S.theme=v;}));
  w.appendChild(segRow('Warm night light',[[true,'On'],[false,'Off']],S.warm,function(v){S.warm=v;}));
  w.appendChild(h('h3',{text:'Sound'}));
  w.appendChild(segRow('Read questions aloud',[[true,'On'],[false,'Off']],S.voice,function(v){S.voice=v;}));
  var vl=englishVoices();
  if(vl.length>1)w.appendChild(segRow('Voice',[['','Most natural']].concat(vl.slice(0,8).map(function(v){return[v.name,v.label];})),S.voiceName||'',function(v){S.voiceName=v;applyVoice();setTimeout(function(){say('Hello! This is how I sound.',true);},150);}));
  w.appendChild(segRow('Speaking speed',[[.8,'Slower'],[.95,'Normal'],[1.1,'Faster']],S.rate||.95,function(v){S.rate=v;applyVoice();}));
  w.appendChild(segRow('Sound effects',[[true,'On'],[false,'Off']],S.sfx,function(v){S.sfx=v;}));
  var stat=h('p',{class:'pstat',text:voiceStatus()});
  var test=h('button',{class:'segb',type:'button',text:'Test voice'});
  test.addEventListener('click',function(){
    say('Hello! I will read the questions out loud.',true);
    setTimeout(function(){if(screen==='parent')stat.textContent=voiceStatus();},3200);
  });
  w.appendChild(h('div',{class:'prow'},[h('span',{class:'plabel',text:'Voice check'}),test,stat]));
  w.appendChild(h('p',{text:'The speaker button in every game reads the question again, even when reading aloud is off. Voices come from the device. On a Fire tablet, a better voice can be downloaded in the tablet\u2019s text-to-speech settings, then chosen here.'}));
  var B=S.best||{},bl=[1,2,3,4,5].filter(function(l){return B[l];}).map(function(l){return'level '+l+': '+B[l];});
  w.appendChild(h('h3',{text:'Mole pop best scores'}));
  w.appendChild(h('p',{text:bl.length?bl.join(', ')+'.':'No scores yet.'}));
  $app.appendChild(w);
  w.scrollTop=keep;
}
function applyTheme(){
  document.documentElement.setAttribute('data-mode',S.theme==='light'?'light':'dark');
  var wm=document.getElementById('warm');if(wm)wm.style.display=S.warm?'block':'none';
}

/* ---------- back: device back button, back gesture or a swipe in from the left edge returns home ---------- */
var inPlay=false,AUTO=location.hash==='#autopilot';
var lastWH=innerWidth+'x'+innerHeight;
window.addEventListener('resize',function(){if(screen==='home'||screen==='cat'){clearTimeout(window.__hr);window.__hr=setTimeout(function(){
  var wh=innerWidth+'x'+innerHeight;if(wh===lastWH)return;lastWH=wh;var ls=lastStamp;
  if(screen==='home')home(true);else if(screen==='cat'&&openCat)openCategory(openCat);
  lastStamp=ls;},150);}});
try{if(location.hash==='#play')history.replaceState(null,'',location.pathname+location.search);}catch(e){}
function enterPlay(){if(inPlay)return;try{history.pushState({ls:1},'','#play');inPlay=true;}catch(e){}}
window.addEventListener('popstate',function(){if(inPlay){inPlay=false;home(true);}});
(function(){
  var sx=0,sy=0,on=false,dx=0,ind=null,EDGE=24,GO=90;
  function el(){if(!ind){ind=h('div',{class:'edgeback','aria-hidden':'true',html:ICON.back});document.body.appendChild(ind);}return ind;}
  function cancel(){on=false;if(ind){ind.style.transform='translateX(-70px)';ind.style.opacity='0';ind.classList.remove('ready');}}
  document.addEventListener('touchstart',function(e){
    if(screen==='home'||e.touches.length!==1)return;
    var t=e.touches[0];if(t.clientX>EDGE)return;
    on=true;sx=t.clientX;sy=t.clientY;dx=0;
    var i=el();i.style.top=Math.max(8,sy-28)+'px';cancel();on=true;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!on)return;
    var t=e.touches[0];dx=t.clientX-sx;
    if(Math.abs(t.clientY-sy)>Math.max(70,dx)){cancel();return;}
    var p=Math.max(0,Math.min(dx,120));
    ind.style.transform='translateX('+(p-70)+'px)';ind.style.opacity=String(Math.min(1,p/50));
    ind.classList.toggle('ready',dx>=GO);
  },{passive:true});
  document.addEventListener('touchend',function(){if(!on)return;var go=dx>=GO;cancel();if(go&&screen!=='home'){sfx('tick');home();}},{passive:true});
  document.addEventListener('touchcancel',cancel,{passive:true});
})();

applyVoice();
applyTheme();
home();
/* installed app: work offline, and ask the browser to keep her progress */
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if(location.search.indexOf('test=1')>=0)window.__T={home:home,startGame:startGame,startPuzzle:startPuzzle,G:function(){return G;},S:S,g:{countGame:countGame,lettersGame:lettersGame,shapesGame:shapesGame,nextGame:nextGame,pairsGame:pairsGame,copyGame:copyGame,lightGame:lightGame,moleGame:moleGame,brickGame:brickGame,raceGame:raceGame,capyGame:capyGame,trolleyGame:trolleyGame,spotGame:spotGame,balloonGame:balloonGame,wordPuz:wordPuz,sortPuz:sortPuz,gardenPuz:gardenPuz}};
})();
</script>
