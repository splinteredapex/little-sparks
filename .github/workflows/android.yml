name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the offline copy of the games inside the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html icon-192.png icon-512.png android/app/src/main/assets/

      - name: Build the app
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish the install file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk little-sparks.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest little-sparks.apk \
            --title "Little Sparks app (build ${{ github.run_number }})" \
            --notes "Install file for Android and Amazon Fire tablets. Built from ${{ github.sha }}."
